version: 2

# A version is proposed once it is 7 days old; cooldown never delays a security update.
# Dependabot rewrites each NuGet project's lock file but not THIRD_PARTY_NOTICES.md; dependency-notices.yml completes its branch.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ''
    labels:
      - dependencies

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ['*']
    commit-message:
      prefix: ''
    labels:
      - dependencies

  - package-ecosystem: npm
    directories:
      - /scripts/real-tools
      - /scripts/mcpb-cli
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: ''
    labels:
      - dependencies

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      submodules:
        patterns: ['*']
    commit-message:
      prefix: ''
    labels:
      - dependencies
