name: install

# Runs the install instructions from README.md on the operating system they are written for, against
# the real published assets. The commands are not copied into this workflow or into the script it
# calls: scripts/verify-install.sh extracts them from between sentinel comments in the document and
# executes them, so what is tested is the text a stranger reads and not a second copy of it.
#
# This is the gate D-0036 requires before an install one-liner may appear on a page at all: "a curl
# line on a launch page is the single instruction a stranger runs first, and one that 404s is worse
# than an honest dotnet build."
#
# The weekly schedule is the part that earns its keep. A release workflow proves the assets existed
# on the day they were uploaded; only a recurring run notices that one was later deleted, renamed,
# or served from a bucket whose public access was turned off. That failure mode is silent by nature -
# nobody reports a 404 they hit before they had any reason to trust the project.
#
# Pinned to commit SHAs for the same reason release.yml is: this workflow's verdict decides whether
# the documented install stays on the page, so a mutated action here could vouch for a broken one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'A version in release-targets.json published[]. Blank means the advertised one. Naming an unadvertised candidate is how a release is exercised before any page points at it.'
        required: false
        type: string
  schedule:
    # Mondays, 07:00 UTC. No relation to release timing on purpose - a check that only ever runs
    # right after a publish tests the day everything was known to be fine.
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      # Every advertised target that records an install_check has a row here, and
      # verify-release-matrix.sh refuses a definition where one does not - so a target cannot be
      # advertised on the download page and quietly go untested. `os` is install_runner, which is
      # deliberately not the build runner: linux-x64 is built on ubuntu-22.04 for the glibc 2.35
      # floor and installed on ubuntu-24.04, so this shows the binary working above its floor
      # rather than only on the machine that made it.
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          # linux-arm64 has no block of its own: README publishes one Linux block and tells an arm64
          # reader to substitute the filename, so that substitution is what verify-install.sh makes
          # and what is tested. Unlike the x64 row this installs on the SAME image it was built on,
          # so it shows the binary working, not the binary working above its floor - the arm64
          # container floor check is still absent, which is what floor_evidence 'unverified' says.
          - os: ubuntu-22.04-arm
            target: linux-arm64
          - os: macos-15
            target: macos
          - os: windows-2025
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 for the same reason ci.yml's gate job has it: the release-matrix gate reads
      # prior revisions of release-targets.json, and on a depth-1 checkout that history is absent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # R.0a. The only job that asks dl.keypaste.com whether the releases release-targets.json
      # records are still there. It runs here rather than in ci.yml or the release guard because an
      # origin that cannot be reached is not evidence about the definition, and this workflow is
      # already weekly-cron plus dispatch and already network-bound. It tells an unreachable origin
      # from a missing asset with a positive control, and only the second is a failure.
      - name: Verify the published releases are still on the origin
        shell: bash
        run: scripts/verify-release-matrix.sh --with-public-origin

      # No setup-dotnet, and that absence is the point. A published binary is self-contained; if any
      # step here needed a .NET SDK the claim on the page would be wrong. KEYPASTE_EXPECT_VERSION is
      # passed in for the same reason - the script's fallback reads VersionPrefix with msbuild, which
      # The expected version comes from release-targets.json, not from README.md. It used to be
      # scraped out of the README's own URLs, which made this job circular: a README naming the
      # wrong version would have been checked against the wrong version and passed. The definition
      # records what was actually published, and verify-release-matrix.sh separately holds the
      # README to it - so the two claims are made by two different things.
      - name: Read the version to install
        id: v
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          adv="$(jq -r '[.published[] | select(.advertised == true)] | last | .version' release-targets.json | tr -d '\r')"
          case "$adv" in
            ''|null) echo "::error::release-targets.json advertises no published release"; exit 1 ;;
          esac

          if [ -z "${REQUESTED:-}" ]; then
            v="$adv"
            echo "the advertised release is $v"
          else
            # Only a version this repository has recorded as published. A free-text box pointed at
            # an arbitrary prefix would turn a green run into evidence about somebody else's bytes.
            n="$(jq -r --arg v "$REQUESTED" '[.published[] | select(.version == $v)] | length' release-targets.json | tr -d '\r')"
            case "$n" in ''|*[!0-9]*) echo "::error::could not count published entries for $REQUESTED"; exit 1 ;; esac
            [ "$n" -ge 1 ] || { echo "::error::$REQUESTED is not in release-targets.json published[]; nothing was installed"; exit 1; }
            v="$REQUESTED"
            if [ "$v" = "$adv" ]; then
              echo "installing $v, which is also the advertised release"
            else
              echo "::notice::installing $v, an UNADVERTISED release. README names $adv and still should."
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # --negative is not passed on Windows: the script refuses that combination outright rather
      # than skipping it quietly, because the decoy substitution shims curl and the Windows block
      # uses Invoke-WebRequest. The Linux and macOS runs both carry it, so the assertion that the
      # checksum line fails closed is made on every scheduled run and not only on request.
      - name: Run the documented install commands, verbatim
        shell: bash
        env:
          KEYPASTE_EXPECT_VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # --version is always passed and is a no-op when README already names it; the script
          # substitutes only when the two differ, and says so loudly when it does.
          if [ "${{ matrix.target }}" = "windows" ]; then
            scripts/verify-install.sh windows --version "$KEYPASTE_EXPECT_VERSION"
          else
            scripts/verify-install.sh ${{ matrix.target }} --negative --version "$KEYPASTE_EXPECT_VERSION"
          fi
