name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Cancelling an upload can leave an immutable version incomplete.
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip
  R2_BUCKET: keypaste-public-dl

jobs:
  guard:
    name: guard
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      suffix: ${{ steps.v.outputs.suffix }}
      publish: ${{ steps.v.outputs.publish }}
      targets: ${{ steps.targets.outputs.targets }}
      app_run_id: ${{ steps.gates.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # This job never restores packages, so enabling NuGet caching would fail on an absent cache.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Resolve and check the version
        id: v
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            publish=true
          else
            tag="$(dotnet msbuild src/Keypaste.Cli/Keypaste.Cli.csproj -getProperty:VersionPrefix -nologo | tr -d '[:space:]')-dryrun"
            publish=false
          fi
          suffix=""
          case "$tag" in *-*) suffix="${tag#*-}";; esac

          if [ "$publish" = "true" ]; then
            scripts/require-tag-matches-source.sh "$GITHUB_REF_NAME"
          fi

          {
            echo "version=$tag"
            echo "suffix=$suffix"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "building $tag (suffix='$suffix', publish=$publish)"

      - name: Check the commit is on main and both gates are green on it
        id: gates
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not an ancestor of main"; exit 1; }

          scripts/require-green-gates.sh "$GITHUB_SHA"

          # The same reply says WHICH app run built this commit. Its packages are what the
          # publish job takes, so a release never republishes bytes a second build made (4.7c).
          scripts/require-green-gates.sh --run-id app "$GITHUB_SHA" "$GITHUB_REF" >> "$GITHUB_OUTPUT"

      - name: Verify one release definition answers for every target
        shell: bash
        run: scripts/verify-release-matrix.sh

      # GitHub reports an empty build matrix as a successful skipped job.
      - name: Resolve the targets this release builds
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          n="$(jq -r '.components.cli.targets | length' release-targets.json)"
          case "$n" in
            ''|*[!0-9]*) echo "::error::release-targets.json did not answer with a target count"; exit 1 ;;
          esac
          [ "$n" -ge 1 ] || { echo "::error::release-targets.json advertises no cli targets"; exit 1; }
          targets="$(jq -c '[.components.cli.targets[] | {rid, os: .runner, archive}]' release-targets.json)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$n targets: $targets"

      - name: Check CHANGELOG.md has a section for this version
        if: github.ref_type == 'tag'
        shell: bash
        run: scripts/require-changelog-section.sh "${{ steps.v.outputs.version }}"

      # Check the publisher's credentials on dispatch before paying for the platform builds.
      - name: Check the publish credentials reach the bucket this release goes to
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          command -v aws >/dev/null 2>&1 \
            || { echo "::error::no aws CLI on this runner, and nothing installs it"; exit 1; }
          aws --version

          present=1
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || present=0
          done

          if [ "$present" -eq 0 ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
                [ -n "${!v}" ] || echo "::error::secret $v is not set"
              done
              exit 1
            fi
            echo "dispatch: this repository has no R2 secrets, and this run publishes nothing"
            exit 0
          fi
          echo "all three R2 secrets are present; asking R2 whether they work"

          AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
          AWS_DEFAULT_REGION=auto \
            scripts/publish-release.sh --check "$VERSION"

      - name: Verify the release preflight refuses a release that is not whole
        shell: bash
        run: scripts/verify-release-preflight.sh

      - name: Verify the provenance check refuses a release this workflow did not attest
        shell: bash
        run: scripts/verify-provenance.sh --selftest

      - name: Verify the green-gate check refuses a commit whose gates are not green
        shell: bash
        run: scripts/verify-green-gates.sh

      - name: Verify the release destination check fails closed
        shell: bash
        run: scripts/verify-release-destination.sh --with-real-aws

  build:
    name: build ${{ matrix.rid }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.guard.outputs.targets) }}
    # NativeAOT inherits the runner's glibc floor recorded in release-targets.json.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # id-token is exchanged only by the Azure login, which runs only under an authenticode policy.
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      KEYPASTE_BIN: artifacts/release/${{ matrix.rid }}/keypaste
      KEYPASTE_MCP_BIN: artifacts/release/${{ matrix.rid }}/keypaste-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install the native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Check the native toolchain (macOS)
        if: runner.os == 'macOS'
        run: xcode-select -p

      # Adding -r here narrows the RID set and invalidates the multi-RID lock file (D-0040).
      - name: Restore (locked)
        run: dotnet restore keypaste.slnx --locked-mode

      - name: Publish both binaries with NativeAOT
        shell: bash
        run: |
          args=(-c Release -r "${{ matrix.rid }}" --no-restore -o "artifacts/release/${{ matrix.rid }}")
          if [ -n "${{ needs.guard.outputs.suffix }}" ]; then
            args+=("-p:VersionSuffix=${{ needs.guard.outputs.suffix }}")
          fi
          dotnet publish src/Keypaste.Cli/Keypaste.Cli.csproj "${args[@]}" 2>&1 | tee /tmp/publish-cli.log
          dotnet publish src/Keypaste.Mcp/Keypaste.Mcp.csproj "${args[@]}" 2>&1 | tee /tmp/publish-mcp.log

      - name: Verify the AOT trim diagnostics still match the baseline
        shell: bash
        run: scripts/verify-aot-trim.sh /tmp/publish-cli.log /tmp/publish-mcp.log

      - name: Delete the JIT build and prove what is left is native
        shell: bash
        run: |
          # Verification scripts otherwise fall back to the JIT build when an override is missing.
          rm -rf artifacts/bin
          for n in keypaste keypaste-mcp; do
            p="artifacts/release/${{ matrix.rid }}/$n"
            [ -x "$p" ] || [ -x "$p.exe" ] || { echo "::error::no native $n"; exit 1; }
          done
          for stray in artifacts/release/${{ matrix.rid }}/*.dll artifacts/release/${{ matrix.rid }}/*.runtimeconfig.json; do
            [ -e "$stray" ] && { echo "::error::$stray exists, so this is a JIT apphost, not an AOT binary"; exit 1; }
          done
          printed="$("$KEYPASTE_BIN" --version 2>/dev/null || "$KEYPASTE_BIN.exe" --version)"
          [ "$printed" = "$VERSION" ] \
            || { echo "::error::binary reports '$printed', tag says '$VERSION'"; exit 1; }

      - name: Verify run injects a variable and writes nothing to disk
        shell: bash
        run: scripts/verify-run-injection.sh

      - name: Verify run forwards signals and exit codes
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/verify-run-signals.sh

      - name: Verify keypaste-mcp speaks MCP over stdio and audits every call
        shell: bash
        run: scripts/verify-mcp-stdio.sh

      - name: Verify a person can approve and refuse across two real processes
        shell: bash
        run: scripts/verify-approval-e2e.sh

      - name: Verify a policy rule grants without a prompt
        shell: bash
        timeout-minutes: 10
        run: scripts/verify-policy-e2e.sh

      - name: Verify the audit chain catches tampering and forgives a crash
        shell: bash
        run: scripts/verify-log-chain.sh

      - name: Verify the demo page still matches what the AOT binaries print
        shell: bash
        timeout-minutes: 8
        run: scripts/verify-demo.sh

      # Every packaged RID must pass the real KeePassXC compatibility gate (PRODUCT law 4.6).
      - name: Install KeePassXC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends keepassxc

      - name: Install KeePassXC (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install --cask keepassxc

      - name: Install KeePassXC (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "KPXC_CLI=$(bash scripts/install-keepassxc-windows.sh)" >> "$GITHUB_ENV"

      - name: Verify a vault written by the AOT binary opens in real KeePassXC
        shell: bash
        env:
          KP_COMPAT_PASSWORD: ci-master-pw
        run: |
          scripts/make-compat-fixture.sh artifacts/compat/aot.kdbx
          scripts/verify-keepassxc-compat.sh artifacts/compat/aot.kdbx
          scripts/verify-keepassxc-writeback.sh artifacts/compat/aot-writeback.kdbx

      # Archive extraction omits the quarantine attribute that browsers apply to downloads.
      - name: Check the ad-hoc signature and the quarantine behaviour (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign -dv --verbose=4 "$KEYPASTE_BIN" 2>&1 | sed -n '1,6p' || true
          xattr -w com.apple.quarantine "0081;00000000;Safari;" "$KEYPASTE_BIN"
          if "$KEYPASTE_BIN" --version >/dev/null 2>&1; then
            echo "quarantined binary ran: the README's xattr line may be unnecessary"
          else
            echo "quarantined binary was blocked, which is what the README's xattr line is for"
          fi
          xattr -d com.apple.quarantine "$KEYPASTE_BIN"

      - name: Check the glibc floor on a clean Debian 12
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          docker run --rm -v "$PWD/artifacts/release/linux-x64:/kp:ro" debian:12-slim /kp/keypaste --version \
            || { echo "::error::the linux-x64 binary does not run on Debian 12 - the glibc floor is higher than documented"; exit 1; }
          if docker run --rm -v "$PWD/artifacts/release/linux-x64:/kp:ro" alpine:3 /kp/keypaste --version >/dev/null 2>&1; then
            echo "::error::it ran on Alpine, which contradicts the documented musl gap - re-check the claim"
            exit 1
          fi
          echo "glibc floor confirmed: Debian 12 yes, Alpine no (musl needs linux-musl-x64, O-0013)"

      - name: Restore the pinned signing dlib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/sign-windows.sh --restore-dlib

      - name: Resolve the signing policy (Windows)
        id: signing
        if: runner.os == 'Windows'
        shell: bash
        run: echo "policy=$(jq -r '.components.cli.signing.policy' release-targets.json | tr -d '\r')" | tee -a "$GITHUB_OUTPUT"

      - name: Sign in to Azure for Artifact Signing
        if: runner.os == 'Windows' && steps.signing.outputs.policy == 'authenticode'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.KEYPASTE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.KEYPASTE_SIGNING_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign the binaries as the definition's policy says (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          KEYPASTE_SIGNING_ENDPOINT: ${{ vars.KEYPASTE_SIGNING_ENDPOINT }}
          KEYPASTE_SIGNING_ACCOUNT: ${{ vars.KEYPASTE_SIGNING_ACCOUNT }}
          KEYPASTE_SIGNING_PROFILE: ${{ vars.KEYPASTE_SIGNING_PROFILE }}
          KEYPASTE_SIGNING_CLIENT_ID: ${{ vars.KEYPASTE_SIGNING_CLIENT_ID }}
          KEYPASTE_SIGNING_TENANT_ID: ${{ vars.KEYPASTE_SIGNING_TENANT_ID }}
        run: scripts/sign-windows.sh --component cli "artifacts/release/${{ matrix.rid }}"

      - name: Package and hash
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/dist"; mkdir -p "$out"
          stage="artifacts/stage"; rm -rf "$stage"; mkdir -p "$stage"
          src="artifacts/release/${{ matrix.rid }}"
          for n in keypaste keypaste-mcp; do
            if   [ -f "$src/$n" ];     then cp "$src/$n"     "$stage/"
            elif [ -f "$src/$n.exe" ]; then cp "$src/$n.exe" "$stage/"
            else echo "::error::$n is missing from $src"; exit 1
            fi
          done
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage"/
          name="keypaste-${VERSION}-${{ matrix.rid }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$stage" && /c/Windows/System32/tar.exe -a -c -f "../dist/$name.zip" ./*)
          else
            # Exclude macOS AppleDouble metadata from release archives.
            COPYFILE_DISABLE=1 tar -czf "$out/$name.tar.gz" -C "$stage" .
          fi
          arch="$name.${{ matrix.archive }}"
          asset="$out/$arch"
          if command -v sha256sum >/dev/null 2>&1; then
            hash="$(cd "$out" && sha256sum "$arch" | cut -d' ' -f1)"
          else
            hash="$(cd "$out" && shasum -a 256 "$arch" | cut -d' ' -f1)"
          fi
          [ "${#hash}" -eq 64 ] || { echo "::error::bad checksum '$hash' for $arch"; exit 1; }
          # Both checksum tools accept two spaces, while their default output formats differ.
          printf '%s  %s\n' "$hash" "$arch" > "$asset.sha256"

          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$out" && sha256sum -c "$arch.sha256")
          else
            (cd "$out" && shasum -a 256 -c "$arch.sha256")
          fi
          ls -l "$out"; cat "$asset.sha256"

      - name: Verify the packaged binaries publish as the project
        shell: bash
        run: scripts/verify-publisher-metadata.sh artifacts/stage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to R2
    needs: [guard, build]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Re-verify every checksum on this machine
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          shopt -s nullglob
          for f in *.sha256; do
            sha256sum -c "$f" || { echo "::error::checksum mismatch for $f after transport"; exit 1; }
          done

      # Which components this release publishes, asked of the definition rather than remembered. A
      # component that is declared but not yet signed answers 2 and is left out, so the desktop leg
      # turns itself on when 3.6b flips the definition rather than when somebody remembers to.
      - name: Resolve which components this release publishes
        id: components
        shell: bash
        run: |
          set -euo pipefail
          list=""
          for c in $(jq -r '[.components | to_entries[] | select(.value.origin != null) | .key] | .[]' release-targets.json | tr -d '\r'); do
            rc=0
            scripts/require-release-assets.sh --component "$c" --publishable || rc=$?
            case "$rc" in
              0) list="$list $c" ;;
              2) echo "::notice::$c is declared and not yet publishable; this release leaves it out" ;;
              *) exit 1 ;;
            esac
          done
          [ -n "$list" ] || { echo "::error::no component of this release is publishable"; exit 1; }
          echo "list=${list# }" >> "$GITHUB_OUTPUT"
          echo "publishing:$list"

      # The desktop packages were built by app.yml on this tag, not here. They arrive from that run
      # rather than being rebuilt, so the bytes installed on a runner in 4.7b and upgraded in 4.7d
      # are the bytes that reach the origin.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: contains(steps.components.outputs.list, 'app')
        with:
          pattern: app-*
          path: ${{ runner.temp }}/app
          merge-multiple: true
          run-id: ${{ needs.guard.outputs.app_run_id }}
          github-token: ${{ github.token }}

      # Every candidate is held to app.yml's own attestation for THIS tag before it is staged, so a
      # package from another run, another tag or a dispatch cannot enter the directory that uploads.
      # The names come from the definition: a literal .msi here would make verify-release-matrix.sh
      # demand that this workflow sign an installer it does not build.
      - name: Take only the desktop packages the app run attested for this tag
        if: contains(steps.components.outputs.list, 'app')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The component column is not read here: this step is the app leg by construction.
          while IFS=$'\t' read -r _ rid name; do
            [ -n "$name" ] || continue
            case "$name" in *.sha256) continue ;; esac
            scripts/verify-desktop-candidate.sh "$RUNNER_TEMP/app/$name" "$VERSION" "$rid"
            cp "$RUNNER_TEMP/app/$name" "$RUNNER_TEMP/app/$name.sha256" dist/
          done < <(scripts/release-completion.sh --component app assets "$VERSION")
          ls -l dist

      - name: Build the corresponding-source tarball
        shell: bash
        run: |
          git archive --format=tar.gz --prefix="keypaste-${VERSION}/" \
            -o "dist/keypaste-${VERSION}-source.tar.gz" "$GITHUB_SHA"
          (cd dist && sha256sum "keypaste-${VERSION}-source.tar.gz" > "keypaste-${VERSION}-source.tar.gz.sha256")

      # The subject list comes from the definition, not from a glob. A glob wide enough to catch the
      # desktop packages would have to name their extensions, and a literal .msi in this workflow
      # makes verify-release-matrix.sh demand that it sign an installer it does not build. The two
      # sides stay independent: this hashes what the definition says a release is, and compares it
      # with what the builders wrote beside each asset.
      - name: Aggregate SHA256SUMS
        shell: bash
        env:
          COMPONENTS: ${{ steps.components.outputs.list }}
        run: |
          set -euo pipefail
          for c in $COMPONENTS; do
            scripts/release-completion.sh --component "$c" names "$VERSION"
          done | awk '!/\.sha256$/ && $0 != "SHA256SUMS"' | sort -u > "$RUNNER_TEMP/sums.names"
          cat "$RUNNER_TEMP/sums.names"
          (cd dist && xargs -a "$RUNNER_TEMP/sums.names" sha256sum | sort -k2 > SHA256SUMS)
          (cd dist && cat ./*.sha256 | sort -k2 > "$RUNNER_TEMP/per-asset")
          diff <(grep -v SHA256SUMS dist/SHA256SUMS) "$RUNNER_TEMP/per-asset" \
            || { echo "::error::SHA256SUMS disagrees with the per-asset checksum files"; exit 1; }
          cat dist/SHA256SUMS

      # One manifest and one bundle per component, in one prefix. Each names only its own component's
      # assets, so verify-provenance.sh checks each against the workflow the definition says attests
      # it, and neither sees the other's files as strays.
      - name: Write the release manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(scripts/release-completion.sh manifest-name "$VERSION")"
          scripts/release-completion.sh record "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_SHA" dist > "dist/$manifest"
          cat "dist/$manifest"
          (cd dist && jq -r '.assets[].name' "$manifest" | xargs sha256sum && sha256sum "$manifest") > "$RUNNER_TEMP/subjects-cli.sha256"
          cat "$RUNNER_TEMP/subjects-cli.sha256"

      - name: Attest every asset and the manifest
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects-cli.sha256
          show-summary: true

      # Copied straight after its own attest step, because the next one overwrites the output.
      - name: Publish the attestation bundle with the release
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" "dist/$(scripts/release-completion.sh bundle-name "$VERSION")"

      - name: Write the desktop manifest
        if: contains(steps.components.outputs.list, 'app')
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(scripts/release-completion.sh --component app manifest-name "$VERSION")"
          scripts/release-completion.sh --component app record "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_SHA" dist > "dist/$manifest"
          cat "dist/$manifest"
          (cd dist && jq -r '.assets[].name' "$manifest" | xargs sha256sum && sha256sum "$manifest") > "$RUNNER_TEMP/subjects-app.sha256"
          cat "$RUNNER_TEMP/subjects-app.sha256"

      # This release attests what it PUBLISHES. app.yml's attestation, which says who compiled these
      # bytes, was checked by verify-desktop-candidate.sh before they were staged.
      - name: Attest every desktop package and its manifest
        id: attest-app
        if: contains(steps.components.outputs.list, 'app')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects-app.sha256
          show-summary: true

      - name: Publish the desktop attestation bundle with the release
        if: contains(steps.components.outputs.list, 'app')
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest-app.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" "dist/$(scripts/release-completion.sh --component app bundle-name "$VERSION")"

      - name: Check every component's attestation before anything uploads
        shell: bash
        env:
          COMPONENTS: ${{ steps.components.outputs.list }}
        run: |
          set -euo pipefail
          for c in $COMPONENTS; do
            scripts/verify-provenance.sh --component "$c" --dir "$VERSION" dist
          done

      # The next step recursively uploads dist/ to a public origin, so its allowlist must pass first.
      # One call naming every component: asked about one, the others' assets read as strays.
      - name: Refuse to publish anything that is not a whole release
        shell: bash
        env:
          COMPONENTS: ${{ steps.components.outputs.list }}
        run: |
          set -euo pipefail
          args=()
          for c in $COMPONENTS; do args+=(--component "$c"); done
          scripts/require-release-assets.sh "${args[@]}" "$VERSION" dist

      - name: Upload to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: scripts/publish-release.sh --publish "$VERSION" dist

      - name: Verify the public origin serves what each manifest records, and that it is attested
        shell: bash
        env:
          COMPONENTS: ${{ steps.components.outputs.list }}
        run: |
          set -euo pipefail
          for c in $COMPONENTS; do
            manifest="$(scripts/release-completion.sh --component "$c" manifest-name "$VERSION")"
            scripts/release-completion.sh --component "$c" verify "$VERSION" "dist/$manifest"
            scripts/verify-provenance.sh --component "$c" "$VERSION" "$RUNNER_TEMP/public-$c"
          done

      - name: Keep the manifest and bundle whatever the answer was
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: completion-record
          path: |
            dist/keypaste-*-manifest.json
            dist/keypaste-*-provenance.sigstore.jsonl
          if-no-files-found: warn

      - name: Say where it went
        env:
          COMPONENTS: ${{ steps.components.outputs.list }}
          APP_RUN: ${{ needs.guard.outputs.app_run_id }}
        run: |
          {
            echo "### keypaste ${VERSION} published"
            echo ''
            echo "https://dl.keypaste.com/v${VERSION}/"
            echo ''
            echo "components published: ${COMPONENTS}"
            echo ''
            echo 'Binaries are unsigned and un-notarized (O-0010). Every asset is attested; see SECURITY.md.'
            case "$COMPONENTS" in
              *app*) echo "Desktop packages came from app.yml run ${APP_RUN}, whose attestation was checked before staging." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
