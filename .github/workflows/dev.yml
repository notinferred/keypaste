name: dev

# K.6a: builds and tests a pushed branch so a development machine never has to; scripts/dev.sh dispatches it.

on:
  workflow_dispatch:
    inputs:
      target:
        description: auto, build, or a comma list of core, cli, mcp, app, consistency
        type: string
        default: auto
      filter_class:
        description: A fully qualified test class; selects its own project and overrides target
        type: string
        default: ''
      os:
        type: choice
        options: [linux, windows, macos, linux+windows, linux+macos, all]
        default: linux
      gates:
        type: choice
        options: [none, integration, compat, both]
        default: none
      nonce:
        description: Lets scripts/dev.sh find the run it dispatched
        type: string
        default: ''

run-name: dev ${{ github.ref_name }} ${{ inputs.target }} ${{ inputs.filter_class }} ${{ inputs.os }} ${{ inputs.nonce }}

permissions:
  contents: read

concurrency:
  group: dev-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip
  # Reused MSBuild nodes retain artifact handles and can block later Windows builds.
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      os: ${{ steps.plan.outputs.os }}
      backend: ${{ steps.plan.outputs.backend }}
      desktop: ${{ steps.plan.outputs.desktop }}
      tests: ${{ steps.plan.outputs.tests }}
      backend_filter: ${{ steps.plan.outputs.backend_filter }}
      desktop_filter: ${{ steps.plan.outputs.desktop_filter }}
      gates: ${{ steps.plan.outputs.gates }}
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # auto compares the branch with origin/main.
          fetch-depth: 0

      - name: Choose the projects, runners and gates
        id: plan
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          FILTER_CLASS: ${{ inputs.filter_class }}
          OS: ${{ inputs.os }}
          GATES: ${{ inputs.gates }}
          NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          for name in TARGET FILTER_CLASS OS GATES NONCE; do
            [[ "${!name}" =~ ^[A-Za-z0-9_.,+-]*$ ]] || { echo "::error::$name may contain only letters, digits and _.,+-"; exit 1; }
          done
          case "$OS" in
            linux) os='["ubuntu-24.04"]' ;;
            windows) os='["windows-2025"]' ;;
            macos) os='["macos-15"]' ;;
            linux+windows) os='["ubuntu-24.04","windows-2025"]' ;;
            linux+macos) os='["ubuntu-24.04","macos-15"]' ;;
            all) os='["ubuntu-24.04","windows-2025","macos-15"]' ;;
            *) echo "::error::unknown os $OS"; exit 1 ;;
          esac
          integration=false compat=false
          case "$GATES" in
            none) ;;
            integration) integration=true ;;
            compat) compat=true ;;
            both) integration=true compat=true ;;
            *) echo "::error::unknown gates $GATES"; exit 1 ;;
          esac
          backend='' desktop='' backend_filter='' desktop_filter='' checks='' tests=true
          if [ -n "$FILTER_CLASS" ]; then
            case "$FILTER_CLASS" in
              Keypaste.Core.Tests.*) backend=tests/Keypaste.Core.Tests backend_filter="$FILTER_CLASS" ;;
              Keypaste.Cli.Tests.*) backend=tests/Keypaste.Cli.Tests backend_filter="$FILTER_CLASS" ;;
              Keypaste.Mcp.Tests.*) backend=tests/Keypaste.Mcp.Tests backend_filter="$FILTER_CLASS" ;;
              Keypaste.App.Tests.*) desktop=tests/Keypaste.App.Tests desktop_filter="$FILTER_CLASS" ;;
              Keypaste.Consistency.Tests.*) desktop=tests/Keypaste.Consistency.Tests desktop_filter="$FILTER_CLASS" ;;
              *) echo "::error::filter_class must begin with a test project's namespace, such as Keypaste.Core.Tests."; exit 1 ;;
            esac
          elif [ "$TARGET" = auto ]; then
            bash scripts/verify.sh --since origin/main --plan > "$RUNNER_TEMP/plan"
            cat "$RUNNER_TEMP/plan"
            lanes=" $(sed -n 's/^lanes=//p' "$RUNNER_TEMP/plan") "
            planned_os="$(sed -n 's/^backend_os=//p' "$RUNNER_TEMP/plan")"
            backend="$(sed -n 's/^backend_tests=//p' "$RUNNER_TEMP/plan")"
            desktop="$(sed -n 's/^desktop_tests=//p' "$RUNNER_TEMP/plan")"
            # The plan's filter narrows only its backend selection.
            backend_filter="$(sed -n 's/^filter=//p' "$RUNNER_TEMP/plan")"
            case "$lanes" in *" integration "*|*" pages "*) integration=true ;; esac
            case "$lanes" in *" compat "*) compat=true ;; esac
            case "$lanes" in *" scripts "*) checks="$checks scripts" ;; esac
            case "$lanes" in *" rules "*) checks="$checks workflows" ;; esac
            checks="${checks# }"
            unrun=''
            for lane in aot appcompat markers package; do
              case "$lanes" in *" $lane "*) unrun="$unrun $lane" ;; esac
            done
            for label in windows-2025 macos-15; do
              case "$planned_os" in *"\"$label\""*) case "$os" in *"\"$label\""*) ;; *) unrun="$unrun $label" ;; esac ;; esac
            done
            [ -z "$unrun" ] || echo "::warning::the plan also selects$unrun, which this run leaves to ci.yml and app.yml"
          elif [ "$TARGET" = build ]; then
            backend=all desktop=all tests=false
          else
            for name in ${TARGET//,/ }; do
              case "$name" in
                core) backend="$backend tests/Keypaste.Core.Tests" ;;
                cli) backend="$backend tests/Keypaste.Cli.Tests" ;;
                mcp) backend="$backend tests/Keypaste.Mcp.Tests" ;;
                app) desktop="$desktop tests/Keypaste.App.Tests" ;;
                consistency) desktop="$desktop tests/Keypaste.Consistency.Tests" ;;
                *) echo "::error::target takes auto, build or a comma list of core, cli, mcp, app and consistency, not $name"; exit 1 ;;
              esac
            done
            backend="${backend# }" desktop="${desktop# }"
          fi
          case "$integration:$compat" in
            true:true) gates=both ;;
            true:false) gates=integration ;;
            false:true) gates=compat ;;
            *) gates=none ;;
          esac
          if [ -z "$backend$desktop" ] && [ "$gates" = none ]; then
            os='[]'
            [ -n "$checks" ] || echo "::warning::nothing selected to build or test"
          fi
          {
            echo "os=$os"
            echo "backend=$backend"
            echo "desktop=$desktop"
            echo "tests=$tests"
            echo "backend_filter=$backend_filter"
            echo "desktop_filter=$desktop_filter"
            echo "gates=$gates"
            echo "checks=$checks"
          } | tee -a "$GITHUB_OUTPUT"

  checks:
    name: scripts and workflows
    needs: plan
    if: needs.plan.outputs.checks != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHECKS: ${{ needs.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The release matrix verifier checks published targets against repository history.
          fetch-depth: 0

      - name: Run the script fixtures and workflow checks the plan selected
        shell: bash
        run: |
          set -euo pipefail
          for check in $CHECKS; do bash scripts/verify.sh "$check"; done

  test:
    name: test (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      BACKEND: ${{ needs.plan.outputs.backend }}
      DESKTOP: ${{ needs.plan.outputs.desktop }}
      TESTS: ${{ needs.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The solution files join the key so this cache never overwrites ci's or app's.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            *.slnx

      - name: Install GNU timeout (macOS)
        if: runner.os == 'macOS' && (needs.plan.outputs.desktop != '' || needs.plan.outputs.gates == 'integration' || needs.plan.outputs.gates == 'both')
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: command -v gtimeout >/dev/null || brew install coreutils

      - name: Build and test the backend projects
        if: needs.plan.outputs.backend != ''
        env:
          FILTER: ${{ needs.plan.outputs.backend_filter }}
        run: |
          set -euo pipefail
          set --
          if [ "$BACKEND" != all ]; then for p in $BACKEND; do set -- "$@" --project "$p"; done; fi
          bash scripts/verify.sh backend --prepare-only "$@"
          if [ "$TESTS" = true ]; then bash scripts/verify.sh backend --test-only "$@" ${FILTER:+--filter-class "$FILTER"}; fi

      - name: Build and test the desktop projects
        if: needs.plan.outputs.desktop != ''
        env:
          FILTER: ${{ needs.plan.outputs.desktop_filter }}
        run: |
          set -euo pipefail
          set --
          if [ "$DESKTOP" != all ]; then for p in $DESKTOP; do set -- "$@" --project "$p"; done; fi
          bash scripts/verify.sh desktop --prepare-only "$@"
          if [ "$TESTS" = true ]; then bash scripts/verify.sh desktop --test-only "$@" ${FILTER:+--filter-class "$FILTER"}; fi

      - name: Run the integration gate
        if: needs.plan.outputs.gates == 'integration' || needs.plan.outputs.gates == 'both'
        run: |
          set -euo pipefail
          bash scripts/verify.sh integration --prepare-only
          bash scripts/verify.sh integration --test-only

      - name: Install keepassxc-cli (Linux)
        if: runner.os == 'Linux' && (needs.plan.outputs.gates == 'compat' || needs.plan.outputs.gates == 'both')
        run: |
          bash scripts/apt-install.sh --no-install-recommends keepassxc

      - name: Install keepassxc-cli (macOS)
        if: runner.os == 'macOS' && (needs.plan.outputs.gates == 'compat' || needs.plan.outputs.gates == 'both')
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install --cask keepassxc

      - name: Install keepassxc-cli (Windows)
        if: runner.os == 'Windows' && (needs.plan.outputs.gates == 'compat' || needs.plan.outputs.gates == 'both')
        run: |
          set -euo pipefail
          echo "KPXC_CLI=$(bash scripts/install-keepassxc-windows.sh)" >> "$GITHUB_ENV"

      # The same scripts as ci.yml's compat steps.
      - name: Run the KeePassXC compat gate
        if: needs.plan.outputs.gates == 'compat' || needs.plan.outputs.gates == 'both'
        env:
          # KeePassXC's Windows console encoding can alter a non-ASCII master password.
          KP_COMPAT_PASSWORD: ci-master-pw
        run: |
          set -euo pipefail
          dotnet restore keypaste.slnx --locked-mode
          dotnet build keypaste.slnx --no-restore -c Release
          bash scripts/make-compat-fixture.sh artifacts/compat/gen.kdbx
          bash scripts/verify-keepassxc-compat.sh artifacts/compat/gen.kdbx
          bash scripts/verify-keepassxc-writeback.sh artifacts/compat/writeback.kdbx
          bash scripts/verify-keepassxc-history.sh artifacts/compat/history.kdbx
          bash scripts/verify-keepassxc-recyclebin.sh artifacts/compat/recyclebin.kdbx
          bash scripts/verify-keepassxc-run.sh artifacts/compat/run
          bash scripts/verify-keepassxc-backup.sh artifacts/compat/backup.kdbx
          bash scripts/verify-keepassxc-organize.sh artifacts/compat/organize.kdbx
          bash scripts/verify-keepassxc-import.sh artifacts/compat/import
          bash scripts/verify-keepassxc-fields.sh artifacts/compat/fields
          bash scripts/verify-keepassxc-projects.sh artifacts/compat/projects
          bash scripts/verify-keepassxc-keyfile.sh artifacts/compat/keyfile.kdbx
