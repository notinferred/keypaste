name: dev

# F.66: runs one verify.sh profile on one runner on a pushed branch, to retry a failure only that runner showed; scripts/dev.sh
# dispatches it. It is never a release gate or integration evidence, so no dev run stands in for a full ci or app run (D-0383).
#
# R.1a: acts mode installs an existing app.yml run's packages, at any commit, through install-desktop.yml and performs
# the install exercise and R.1a's acts with this branch's scripts, to iterate on them without a new package build.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: The verify.sh profile that profile mode runs; backend, integration, desktop or desktop-gates
        type: string
        default: ''
      os:
        type: choice
        options: [ubuntu-24.04, windows-2025, macos-15, all]
        default: ubuntu-24.04
      app_run:
        description: The successful app.yml run whose packages acts mode installs
        type: string
        default: ''
      nonce:
        description: Lets scripts/dev.sh find the run it dispatched
        type: string
        default: ''
      mode:
        description: profile runs profile, acts installs app_run's packages and performs R.1a's acts
        type: choice
        options: [profile, acts]
        default: profile

run-name: dev ${{ github.ref_name }} ${{ inputs.mode }} ${{ inputs.profile }}${{ inputs.app_run }} ${{ inputs.os }} ${{ inputs.nonce }}

permissions:
  contents: read

# A new dispatch of the same mode, profile and runner on a branch supersedes the run before it.
concurrency:
  group: dev-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.profile }}-${{ inputs.os }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip
  # Reused MSBuild nodes retain artifact handles and can block later Windows builds.
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  # One verify.sh profile on one runner, to retry a failure that only that runner showed (D-0468).
  profile:
    name: ${{ inputs.profile }} (${{ matrix.os }})
    if: inputs.mode == 'profile'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["ubuntu-24.04","windows-2025","macos-15"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install GNU timeout (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: command -v gtimeout >/dev/null || brew install coreutils

      - name: Run the profile
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            backend|integration|desktop|desktop-gates) bash scripts/verify.sh "$PROFILE" ;;
            *) echo "::error::profile must be backend, integration, desktop or desktop-gates"; exit 1 ;;
          esac

  # install-desktop.yml's install exercise and R.1a's acts on app_run's packages, with this branch's scripts (R.1a).
  acts:
    name: acts
    if: inputs.mode == 'acts'
    uses: ./.github/workflows/install-desktop.yml
    with:
      app_run_id: ${{ inputs.app_run }}
      rehearsal: true
      dev: true
      runner: ${{ inputs.os }}
    permissions:
      contents: read
      actions: read
      attestations: read
