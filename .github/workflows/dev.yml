name: dev

# K.6a: builds and tests a pushed branch so a development machine never has to; scripts/dev.sh dispatches it.
# Each profile runs as its own job on each runner, so a run takes as long as its slowest job (F.52).

on:
  workflow_dispatch:
    inputs:
      target:
        description: auto, build, or a comma list of core, cli, mcp, app, consistency
        type: string
        default: auto
      filter_class:
        description: A fully qualified test class; selects its own project and overrides target
        type: string
        default: ''
      os:
        type: choice
        options: [linux, windows, macos, linux+windows, linux+macos, all]
        default: linux
      gates:
        type: choice
        options: [none, integration, compat, both]
        default: none
      nonce:
        description: Lets scripts/dev.sh find the run it dispatched
        type: string
        default: ''
      relock:
        description: Regenerate the lock files instead of building or testing; scripts/dev.sh --relock applies them
        type: boolean
        default: false

run-name: dev ${{ github.ref_name }} ${{ inputs.target }} ${{ inputs.filter_class }} ${{ inputs.os }} ${{ inputs.nonce }}

permissions:
  contents: read

# A new dispatch on a branch supersedes the run before it, whatever runners either asked for.
concurrency:
  group: dev-${{ github.ref }}-${{ inputs.relock }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip
  # Reused MSBuild nodes retain artifact handles and can block later Windows builds.
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reads the pass markers earlier runs left (D-0404).
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      desktop: ${{ steps.plan.outputs.desktop }}
      desktop_filter: ${{ steps.plan.outputs.desktop_filter }}
      desktop_os: ${{ steps.plan.outputs.desktop_os }}
      gates_os: ${{ steps.plan.outputs.gates_os }}
      integration_os: ${{ steps.plan.outputs.integration_os }}
      compat_os: ${{ steps.plan.outputs.compat_os }}
      format: ${{ steps.plan.outputs.format }}
      tests: ${{ steps.plan.outputs.tests }}
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # auto compares the branch with origin/main, and the markers' commits with this one.
          fetch-depth: 0

      - name: Choose the jobs and their runners
        id: plan
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          FILTER_CLASS: ${{ inputs.filter_class }}
          OS: ${{ inputs.os }}
          GATES: ${{ inputs.gates }}
          NONCE: ${{ inputs.nonce }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in TARGET FILTER_CLASS OS GATES NONCE; do
            [[ "${!name}" =~ ^[A-Za-z0-9_.,+-]*$ ]] || { echo "::error::$name may contain only letters, digits and _.,+-"; exit 1; }
          done
          case "$OS" in
            linux) os='["ubuntu-24.04"]' ;;
            windows) os='["windows-2025"]' ;;
            macos) os='["macos-15"]' ;;
            linux+windows) os='["ubuntu-24.04","windows-2025"]' ;;
            linux+macos) os='["ubuntu-24.04","macos-15"]' ;;
            all) os='["ubuntu-24.04","windows-2025","macos-15"]' ;;
            *) echo "::error::unknown os $OS"; exit 1 ;;
          esac
          integration=false compat=false
          case "$GATES" in
            none) ;;
            integration) integration=true ;;
            compat) compat=true ;;
            both) integration=true compat=true ;;
            *) echo "::error::unknown gates $GATES"; exit 1 ;;
          esac
          # The requested runners less those whose marker already holds the mark.
          unpassed() {
            local runner list=''
            for runner in $(jq -r '.[]' <<< "$os"); do
              case " $passed " in *" $runner:$1 "*) ;; *) list="$list,\"$runner\"" ;; esac
            done
            echo "[${list#,}]"
          }
          # The entries of a plan's list whose runner, at the path given, was requested.
          on_requested() { jq -c --argjson os "$os" "[.[] | select($1 as \$o | \$os | index(\$o))]"; }
          passed='' backend='[]' desktop='' desktop_filter='' desktop_os='[]' gates_os='[]'
          integration_os='[]' compat_os='[]' format=false tests=true checks=''
          backend_tests='' backend_filter=''
          if [ -n "$FILTER_CLASS" ]; then
            case "$FILTER_CLASS" in
              Keypaste.Core.Tests.*) backend_tests=tests/Keypaste.Core.Tests backend_filter="$FILTER_CLASS" ;;
              Keypaste.Cli.Tests.*) backend_tests=tests/Keypaste.Cli.Tests backend_filter="$FILTER_CLASS" ;;
              Keypaste.Mcp.Tests.*) backend_tests=tests/Keypaste.Mcp.Tests backend_filter="$FILTER_CLASS" ;;
              Keypaste.App.Tests.*) desktop=tests/Keypaste.App.Tests desktop_filter="$FILTER_CLASS" ;;
              Keypaste.Consistency.Tests.*) desktop=tests/Keypaste.Consistency.Tests desktop_filter="$FILTER_CLASS" ;;
              *) echo "::error::filter_class must begin with a test project's namespace, such as Keypaste.Core.Tests."; exit 1 ;;
            esac
          elif [ "$TARGET" = auto ]; then
            # A job an earlier dispatch or CI run passed on the same inputs is not run again (D-0404, D-0423).
            passed="$(bash scripts/lane-cache.sh | tr '\n' ' ')"
            echo "already passed on these inputs: ${passed:-nothing}"
            bash scripts/verify.sh --since origin/main --plan > "$RUNNER_TEMP/selected"
            VERIFY_SATISFIED="$passed" bash scripts/verify.sh --since origin/main --plan > "$RUNNER_TEMP/plan"
            cat "$RUNNER_TEMP/plan"
            read_plan() { sed -n "s/^$1=//p" "$RUNNER_TEMP/$2"; }
            lanes=" $(read_plan lanes plan) "
            backend="$(read_plan test_matrix plan | on_requested .os | jq -c '[.[] | {os, backend_tests, filter}]')"
            integration_os="$(read_plan integration_matrix plan | on_requested .os | jq -c '[.[].os]')"
            compat_os="$(read_plan compat_os plan | on_requested .)"
            # Desktop marks are kept per runner here, where the plan keeps only Linux's for app.yml.
            desktop="$(read_plan desktop_tests selected)"
            [ -z "$desktop" ] || desktop_os="$(unpassed desktop.tests)"
            [ "$(read_plan app_gates_os selected)" = '[]' ] || gates_os="$(unpassed desktop.gates)"
            case "$lanes" in *" format "*) format=true ;; esac
            case "$lanes" in *" scripts "*) checks="$checks scripts" ;; esac
            # actionlint leaves no marker, so it follows every change to the rules' inputs.
            case " $(read_plan lanes selected) " in *" rules "*) checks="$checks workflows" ;; esac
            checks="${checks# }"
            unrun=''
            for lane in aot appcompat markers package; do
              case "$lanes" in *" $lane "*) unrun="$unrun $lane" ;; esac
            done
            for label in windows-2025 macos-15; do
              case "$(read_plan test_matrix plan)$(read_plan integration_matrix plan)$(read_plan compat_os plan)" in
                *"\"$label\""*) case "$os" in *"\"$label\""*) ;; *) unrun="$unrun $label" ;; esac ;;
              esac
            done
            [ -z "$unrun" ] || echo "::warning::the plan also selects$unrun, which this run leaves to ci.yml and app.yml"
          elif [ "$TARGET" = build ]; then
            backend_tests=all desktop=all tests=false
          else
            for name in ${TARGET//,/ }; do
              case "$name" in
                core) backend_tests="$backend_tests tests/Keypaste.Core.Tests" ;;
                cli) backend_tests="$backend_tests tests/Keypaste.Cli.Tests" ;;
                mcp) backend_tests="$backend_tests tests/Keypaste.Mcp.Tests" ;;
                app) desktop="$desktop tests/Keypaste.App.Tests" ;;
                consistency) desktop="$desktop tests/Keypaste.Consistency.Tests" ;;
                *) echo "::error::target takes auto, build or a comma list of core, cli, mcp, app and consistency, not $name"; exit 1 ;;
              esac
            done
            backend_tests="${backend_tests# }" desktop="${desktop# }"
          fi
          if [ "$TARGET" != auto ] || [ -n "$FILTER_CLASS" ]; then
            if [ -n "$backend_tests" ]; then
              backend="$(jq -cn --argjson os "$os" --arg tests "$backend_tests" --arg filter "$backend_filter" \
                '[$os[] | {os: ., backend_tests: $tests, filter: $filter}]')"
            fi
            [ -z "$desktop" ] || desktop_os="$os"
          fi
          # --gates adds its gates on every requested runner to whatever the target selected.
          if [ "$integration" = true ]; then integration_os="$os"; fi
          if [ "$compat" = true ]; then compat_os="$os"; fi
          if [ "$backend$desktop_os$gates_os$integration_os$compat_os" = '[][][][][]' ] && [ "$format" = false ] && [ -z "$checks" ]; then
            echo "::warning::nothing selected to build or test"
          fi
          {
            echo "backend=$backend"
            echo "desktop=$desktop"
            echo "desktop_filter=$desktop_filter"
            echo "desktop_os=$desktop_os"
            echo "gates_os=$gates_os"
            echo "integration_os=$integration_os"
            echo "compat_os=$compat_os"
            echo "format=$format"
            echo "tests=$tests"
            echo "checks=$checks"
          } | tee -a "$GITHUB_OUTPUT"

  checks:
    name: scripts and workflows
    needs: plan
    if: needs.plan.outputs.checks != '' && !inputs.relock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHECKS: ${{ needs.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The release matrix verifier checks published targets against repository history.
          fetch-depth: 0

      - name: Run the script fixtures and workflow checks the plan selected
        shell: bash
        run: |
          set -euo pipefail
          for check in $CHECKS; do bash scripts/verify.sh "$check"; done
          # ci.yml's scripts lane runs this too, so a marker from here vouches for the same checks.
          case " $CHECKS " in *" scripts "*) scripts/verify-release-destination.sh --with-real-aws ;; esac

      # ci.yml's pushes skip a lane this run passed on the same inputs (D-0404).
      - name: Mark the script fixtures passed on these inputs
        if: success() && contains(format(' {0} ', env.CHECKS), ' scripts ')
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/pass.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && contains(format(' {0} ', env.CHECKS), ' scripts ')
        with:
          name: pass--ubuntu-24.04--scripts
          path: ${{ runner.temp }}/pass.txt
          retention-days: 30

  format:
    needs: plan
    if: needs.plan.outputs.format == 'true' && !inputs.relock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Check every project's format
        run: bash scripts/verify.sh format

      - name: Mark this job passed on these inputs
        if: success()
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/pass.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: pass--ubuntu-24.04--format
          path: ${{ runner.temp }}/pass.txt
          retention-days: 30

  backend:
    name: backend (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.backend != '[]' && !inputs.relock
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.backend) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BACKEND: ${{ matrix.backend_tests }}
      FILTER: ${{ matrix.filter }}
      TESTS: ${{ needs.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build and test the backend projects
        run: |
          set -euo pipefail
          set --
          if [ "$BACKEND" != all ]; then for p in $BACKEND; do set -- "$@" --project "$p"; done; fi
          bash scripts/verify.sh backend --prepare-only "$@"
          if [ "$TESTS" = true ]; then bash scripts/verify.sh backend --test-only "$@" ${FILTER:+--filter-class "$FILTER"}; fi

      # The ci.yml lanes this runner ran in full, for ci.yml's pushes to skip on the same inputs (D-0404).
      - name: Mark the lanes this runner passed on these inputs
        id: pass
        if: success() && env.TESTS == 'true'
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          set -euo pipefail
          lanes=()
          if [ "$BACKEND" = all ] && [ -z "$FILTER" ]; then
            lanes+=(core cli mcp rules)
          else
            for project in $BACKEND; do
              case "$project:$FILTER" in
                tests/Keypaste.Core.Tests:) lanes+=(core rules) ;;
                tests/Keypaste.Core.Tests:Keypaste.Core.Tests.WorkflowRulesTests) lanes+=(rules) ;;
                tests/Keypaste.Cli.Tests:) lanes+=(cli) ;;
                tests/Keypaste.Mcp.Tests:) lanes+=(mcp) ;;
              esac
            done
          fi
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/pass.txt"
          if [ "${#lanes[@]}" -gt 0 ]; then
            echo "name=pass--$RUNNER_LABEL--$(IFS=+; echo "${lanes[*]}")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && steps.pass.outputs.name != ''
        with:
          name: ${{ steps.pass.outputs.name }}
          path: ${{ runner.temp }}/pass.txt
          retention-days: 30

  desktop:
    name: desktop (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.desktop_os != '[]' && !inputs.relock
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.desktop_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DESKTOP: ${{ needs.plan.outputs.desktop }}
      FILTER: ${{ needs.plan.outputs.desktop_filter }}
      TESTS: ${{ needs.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build and test the desktop projects
        run: |
          set -euo pipefail
          set --
          if [ "$DESKTOP" != all ]; then for p in $DESKTOP; do set -- "$@" --project "$p"; done; fi
          bash scripts/verify.sh desktop --prepare-only "$@"
          if [ "$TESTS" = true ]; then bash scripts/verify.sh desktop --test-only "$@" ${FILTER:+--filter-class "$FILTER"}; fi

      # app.yml reads only Linux's mark; the others let the next dispatch here skip this job.
      - name: Mark this job passed on these inputs
        if: success() && env.TESTS == 'true' && env.DESKTOP == 'all' && env.FILTER == ''
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/pass.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && env.TESTS == 'true' && env.DESKTOP == 'all' && env.FILTER == ''
        with:
          name: pass--${{ matrix.os }}--desktop.tests
          path: ${{ runner.temp }}/pass.txt
          retention-days: 30

  desktop-gates:
    name: desktop gates (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.gates_os != '[]' && !inputs.relock
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.gates_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install GNU timeout (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: command -v gtimeout >/dev/null || brew install coreutils

      - name: Drive the app, the CLI and an agent as real processes
        run: bash scripts/verify.sh desktop-gates

      - name: Mark this job passed on these inputs
        if: success()
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/pass.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: pass--${{ matrix.os }}--desktop.gates
          path: ${{ runner.temp }}/pass.txt
          retention-days: 30

  integration:
    name: integration (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.integration_os != '[]' && !inputs.relock
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.integration_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install GNU timeout (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: command -v gtimeout >/dev/null || brew install coreutils

      - name: Run the integration gate
        run: bash scripts/verify.sh integration

      # The demo check is the pages lane, which ci.yml runs on Linux alone.
      - name: Mark the lanes this runner passed on these inputs
        id: pass
        if: success()
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/pass.txt"
          name="pass--$RUNNER_LABEL--integration"
          if [ "$RUNNER_LABEL" = ubuntu-24.04 ]; then name="$name+pages"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: ${{ steps.pass.outputs.name }}
          path: ${{ runner.temp }}/pass.txt
          retention-days: 30

  compat:
    name: compat (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.compat_os != '[]' && !inputs.relock
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.compat_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install keepassxc-cli (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          bash scripts/apt-install.sh --no-install-recommends keepassxc

      - name: Install keepassxc-cli (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install --cask keepassxc

      - name: Install keepassxc-cli (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          echo "KPXC_CLI=$(bash scripts/install-keepassxc-windows.sh)" >> "$GITHUB_ENV"

      # The same scripts as ci.yml's compat job.
      - name: Run the KeePassXC compat gate
        env:
          # KeePassXC's Windows console encoding can alter a non-ASCII master password.
          KP_COMPAT_PASSWORD: ci-master-pw
        run: |
          set -euo pipefail
          bash scripts/verify.sh backend --prepare-only
          bash scripts/make-compat-fixture.sh artifacts/compat/gen.kdbx
          bash scripts/verify-keepassxc-compat.sh artifacts/compat/gen.kdbx
          bash scripts/verify-keepassxc-writeback.sh artifacts/compat/writeback.kdbx
          bash scripts/verify-keepassxc-history.sh artifacts/compat/history.kdbx
          bash scripts/verify-keepassxc-recyclebin.sh artifacts/compat/recyclebin.kdbx
          bash scripts/verify-keepassxc-run.sh artifacts/compat/run
          bash scripts/verify-keepassxc-backup.sh artifacts/compat/backup.kdbx
          bash scripts/verify-keepassxc-organize.sh artifacts/compat/organize.kdbx
          bash scripts/verify-keepassxc-import.sh artifacts/compat/import
          dotnet restore tests/Keypaste.AppDriver/Keypaste.AppDriver.csproj --locked-mode
          dotnet build tests/Keypaste.AppDriver/Keypaste.AppDriver.csproj --no-restore -c Release
          npm ci --prefix site --no-audit --no-fund
          bash scripts/verify-keepassxc-fields.sh artifacts/compat/fields
          bash scripts/verify-keepassxc-projects.sh artifacts/compat/projects
          bash scripts/verify-keepassxc-keyfile.sh artifacts/compat/keyfile.kdbx

      - name: Mark this job passed on these inputs
        if: success()
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/pass.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: pass--${{ matrix.os }}--compat
          path: ${{ runner.temp }}/pass.txt
          retention-days: 30

  # A development machine has no SDK, so a changed dependency or RuntimeIdentifiers list gets its lock
  # files here: the same SDK as ci.yml and app.yml restores every locked project against what it now declares.
  relock:
    name: regenerate lock files
    if: inputs.relock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore against the declared dependencies and keep the lock files that changed
        shell: bash
        run: |
          set -euo pipefail
          for target in keypaste.slnx keypaste.app.slnx tests/Keypaste.Consistency.Tests/Keypaste.Consistency.Tests.csproj; do
            dotnet restore "$target" --force-evaluate
          done
          out="$RUNNER_TEMP/relock"
          mkdir -p "$out"
          git status --porcelain -- '*packages.lock.json' | sed 's/^...//' > "$out/changed.txt"
          while IFS= read -r file; do
            mkdir -p "$out/$(dirname "$file")"
            cp "$file" "$out/$file"
          done < "$out/changed.txt"
          cat "$out/changed.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relock
          path: ${{ runner.temp }}/relock
          retention-days: 7
