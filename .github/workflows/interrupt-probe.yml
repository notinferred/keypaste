name: interrupt-probe

# 4.7d's diagnosis tooling: measures which way of interrupting a per-user MSI upgrade makes Windows Installer
# roll the previous version back, so its interrupted check rests on a mechanism that was observed rather than
# assumed (D-0210, D-0211). Nothing is published, attested or signed; the run is a measurement, not a gate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: interrupt-probe (win-x64)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Before anything that can fail, so a failed run still has a directory to upload from.
      - name: Make the records directory
        shell: bash
        run: mkdir -p interrupt-probe

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore keypaste.app.slnx --locked-mode

      - name: Build the two candidates this probe installs over one another
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-upgrade-candidates.sh win-x64 "$RUNNER_TEMP/candidates" 0.0.1 0.0.2
          ls -l "$RUNNER_TEMP/candidates"

      - name: Measure the three interruptions
        shell: bash
        run: bash scripts/probe-msi-interruption.sh "$RUNNER_TEMP/candidates" interrupt-probe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: interrupt-probe-win-x64
          path: interrupt-probe/
          if-no-files-found: warn
          retention-days: 30
