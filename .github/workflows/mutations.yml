name: mutations

# K.11's probe: Stryker.NET's report over each suite K.11 rewrites, which every test of Keypaste.Core.Tests runs against and
# which names the tests that killed each mutant, so the properties can be shown to kill every mutant the examples they
# replace killed. It runs on the k11 branch only and is deleted before integration; docs/steps/K.11.md keeps its result.

on:
  push:
    branches: [k11]

permissions:
  contents: read

concurrency:
  group: mutations-${{ github.sha }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  suite:
    name: ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: toml
            project: src/Keypaste.Infrastructure
            mutate: Toml.cs TomlWriter.cs
          - suite: csv
            project: src/Keypaste.Infrastructure
            mutate: Csv.cs
          - suite: csv-readers
            project: src/Keypaste.Core
            mutate: Import/CsvExport.cs Import/KeePassXcCsvReader.cs Import/OnePasswordCsvReader.cs Import/LastPassCsvReader.cs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install Stryker.NET
        run: dotnet tool install dotnet-stryker --version 5.0.0 --tool-path "$RUNNER_TEMP/stryker"

      - name: Mutate
        env:
          PROJECT: ${{ matrix.project }}
          MUTATE: ${{ matrix.mutate }}
        run: |
          python3 - <<'PY'
          import json, os
          project = os.environ["PROJECT"]
          mutate = []
          for item in os.environ["MUTATE"].split():
              path, _, lines = item.partition(":")
              if not lines:
                  mutate.append(f"**/{path}")
                  continue
              first, last = (int(n) for n in lines.split("-"))
              text = open(os.path.join(project, path), encoding="utf-8").read().split("\n")
              start = sum(len(line) + 1 for line in text[: first - 1])
              end = sum(len(line) + 1 for line in text[:last]) - 1
              mutate.append(f"**/{path}{{{start}..{end}}}")
          config = {"stryker-config": {
              "test-projects": [os.path.abspath("tests/Keypaste.Core.Tests/Keypaste.Core.Tests.csproj")],
              "test-runner": "mtp",
              "mutate": mutate,
              "reporters": ["json", "progress", "cleartext"],
          }}
          json.dump(config, open(os.path.join(os.environ["RUNNER_TEMP"], "stryker-config.json"), "w"), indent=2)
          print(json.dumps(config, indent=2))
          PY
          # Stryker mutates only a project the test project references itself, and Infrastructure comes through Core.
          if [ "$PROJECT" = src/Keypaste.Infrastructure ]; then
            dotnet add tests/Keypaste.Core.Tests/Keypaste.Core.Tests.csproj reference src/Keypaste.Infrastructure/Keypaste.Infrastructure.csproj
          fi
          cd "$PROJECT"
          "$RUNNER_TEMP/stryker/dotnet-stryker" --config-file "$RUNNER_TEMP/stryker-config.json" --output "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/out/reports/mutation-report.json" "$RUNNER_TEMP/report.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutations-${{ matrix.suite }}
          path: ${{ runner.temp }}/report.json
