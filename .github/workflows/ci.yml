name: ci

on:
  push:
    branches: [main]
    # Keep pages checked by verify-demo.sh out of this list; docs/** would also skip them.
    paths-ignore:
      - 'docs/PRODUCT.md'
      - 'CLAUDE.md'
      - 'docs/STEPS.md'
      - 'docs/steps/**'
      - 'docs/ARCHITECTURE.md'
      - 'DECISIONS.md'
      - 'CHANGELOG.md'
      - 'THREATS.md'
      - 'SECURITY.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'docs/mcp-setup.md'
      - 'docs/replace-dotenv.md'
      - 'docs/policy.md'
      - 'docs/approvals.md'
      - 'docs/desktop.md'
      - 'site/README.md'
      - 'site/public/thanks/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Release tags require a completed verdict for each commit on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  gate:
    name: format + analyzers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The release matrix verifier checks published targets against repository history.
          fetch-depth: 0

      - name: Verify workflows before restoring or building
        shell: bash
        run: bash scripts/verify.sh workflows

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore, format and build with the local verifier
        shell: bash
        run: bash scripts/verify.sh backend --prepare-only

      - name: Verify the release destination check fails closed
        shell: bash
        run: scripts/verify-release-destination.sh --with-real-aws

      - name: Verify the release preflight refuses a release that is not whole
        shell: bash
        run: scripts/verify-release-preflight.sh

      - name: Verify the green-gate check refuses a commit whose gates are not green
        shell: bash
        run: scripts/verify-green-gates.sh

      - name: Verify the change map selects every lane a changed path can break
        shell: bash
        run: scripts/verify-ci-scope.sh

      - name: Verify one release definition answers for every target
        shell: bash
        run: scripts/verify-release-matrix.sh

      # Live-origin checks run separately because this workflow cannot repair the deployed site.
      - name: Verify the disclosure reader survives a jq that writes CRLF
        shell: bash
        run: scripts/verify-site-disclosure.sh --selftest

      - name: Verify a published release is refused unless the public bytes say it is whole
        shell: bash
        run: scripts/verify-release-completion.sh

      - name: Verify the provenance check refuses a release this workflow did not attest
        shell: bash
        run: scripts/verify-provenance.sh --selftest

      - name: Verify Windows signing fails closed and signs only through the pinned dlib or a rehearsal
        shell: bash
        run: scripts/sign-windows.sh --selftest

      - name: Verify the Windows signature check refuses an untrusted, untimestamped or changed file
        shell: bash
        run: scripts/verify-windows-signature.sh --selftest

  test:
    name: test (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore keypaste.slnx --locked-mode

      - name: Build
        run: dotnet build keypaste.slnx --no-restore -c Release

      - name: Test
        run: dotnet test keypaste.slnx --no-build -c Release

      - name: Verify the Windows PowerShell launcher selects Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/verify.ps1 --list

      - name: Verify run injects a variable and writes nothing to disk
        shell: bash
        run: scripts/verify-run-injection.sh

      # The Unix signal verifier has no Windows equivalent; SECURITY.md records that coverage gap.
      - name: Verify run forwards signals and exit codes
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/verify-run-signals.sh

      - name: Verify keypaste-mcp speaks MCP over stdio and audits every call
        shell: bash
        run: scripts/verify-mcp-stdio.sh

      - name: Verify a person can approve and refuse across two real processes
        shell: bash
        run: scripts/verify-approval-e2e.sh

      # A surviving agent process can hold the step open after its assertions finish.
      - name: Verify a policy rule grants without a prompt, and only inside its pattern
        shell: bash
        timeout-minutes: 8
        run: scripts/verify-policy-e2e.sh

      - name: Verify the audit chain catches tampering and forgives a crash
        shell: bash
        run: scripts/verify-log-chain.sh

      - name: Verify the demo page still matches what the binaries print
        shell: bash
        timeout-minutes: 8
        run: scripts/verify-demo.sh

  aot:
    name: aot publish (linux-x64)
    # B.4a experiment: runs beside the gate so the measurement does not wait for it.
    # NativeAOT inherits the build machine's glibc floor, which must match release.yml.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      KEYPASTE_BIN: artifacts/release/linux-x64/keypaste
      KEYPASTE_MCP_BIN: artifacts/release/linux-x64/keypaste-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Adding -r here narrows the RID set and invalidates the multi-RID lock file (D-0040).
      - name: Restore (locked)
        run: dotnet restore keypaste.slnx --locked-mode

      - name: Publish both binaries with NativeAOT
        run: |
          dotnet publish src/Keypaste.Cli/Keypaste.Cli.csproj -c Release -r linux-x64 \
            --no-restore -o artifacts/release/linux-x64 2>&1 | tee /tmp/publish-cli.log
          dotnet publish src/Keypaste.Mcp/Keypaste.Mcp.csproj -c Release -r linux-x64 \
            --no-restore -o artifacts/release/linux-x64 2>&1 | tee /tmp/publish-mcp.log

      - name: 'B.4a: publish the two binaries of the base commit'
        shell: bash
        env:
          BASE_SHA: a432adea7aeb02ce8ce63742c7b24d33b6333836
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          cd "$RUNNER_TEMP/base"
          dotnet restore keypaste.slnx --locked-mode
          dotnet publish src/Keypaste.Cli/Keypaste.Cli.csproj -c Release -r linux-x64 \
            --no-restore -o "$RUNNER_TEMP/base-out" 2>&1 | tee /tmp/base-cli.log
          dotnet publish src/Keypaste.Mcp/Keypaste.Mcp.csproj -c Release -r linux-x64 \
            --no-restore -o "$RUNNER_TEMP/base-out" 2>&1 | tee /tmp/base-mcp.log

      - name: 'B.4a: compare trim diagnostics, size and start time'
        shell: bash
        env:
          ONE: artifacts/release/linux-x64
        run: |
          export LC_ALL=C
          two="$RUNNER_TEMP/base-out"
          diagnostics() { { grep -E 'IL[0-9]{4}' "$1" || true; } | sed -E 's/ \[[^][]*\.csproj\]$//; s#^.*/(third_party|src)/#\1/#' | sort -u; }
          for log in /tmp/base-cli.log /tmp/base-mcp.log /tmp/publish-cli.log /tmp/publish-mcp.log; do
            echo "== $log: $(diagnostics "$log" | wc -l) IL diagnostics"
          done
          echo "== IL diagnostics of the one binary that the base CLI does not emit:"
          comm -13 <(diagnostics /tmp/base-cli.log) <(diagnostics /tmp/publish-cli.log)
          echo "== IL diagnostics of the base CLI that the one binary does not emit:"
          comm -23 <(diagnostics /tmp/base-cli.log) <(diagnostics /tmp/publish-cli.log)
          echo "== the one binary's publish log checked alone against the baseline:"
          scripts/verify-aot-trim.sh /tmp/publish-cli.log || echo "verify-aot-trim.sh failed on the one binary alone"
          ls -l "$two" "$ONE"
          python3 scripts/b4a-measure.py "$ONE" "$two" 60 15 sudo sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches'

      - name: 'B.4a: run the stdio and approval gates through keypaste mcp'
        if: always()
        shell: bash
        env:
          KEYPASTE_ONE_BINARY: ${{ github.workspace }}/artifacts/release/linux-x64/keypaste
        run: |
          wrapper="$RUNNER_TEMP/keypaste-mcp-through-cli"
          cat > "$wrapper" <<'WRAP'
          #!/bin/sh
          exec "$KEYPASTE_ONE_BINARY" mcp "$@"
          WRAP
          chmod +x "$wrapper"
          KEYPASTE_MCP_BIN="$wrapper" scripts/verify-mcp-stdio.sh
          KEYPASTE_MCP_BIN="$wrapper" scripts/verify-approval-e2e.sh
          KEYPASTE_MCP_BIN="$wrapper" scripts/verify-mcp-run.sh
          KEYPASTE_MCP_BIN="$wrapper" scripts/verify-policy-e2e.sh
          KEYPASTE_MCP_BIN="$wrapper" scripts/verify-log-chain.sh

      # Run 36727509499 found it: an executable's project reference copies its runtimeconfig
      # beside the referencing one. B.4b's library has none; removed so the later gates run.
      - name: 'B.4a: remove the bridge runtimeconfig the CLI publish copied'
        shell: bash
        run: rm -v artifacts/release/linux-x64/keypaste-mcp.runtimeconfig.json

      - name: Verify the AOT trim diagnostics still match the baseline
        shell: bash
        run: scripts/verify-aot-trim.sh /tmp/publish-cli.log /tmp/publish-mcp.log

      - name: Point the gates at the AOT binaries and prove they are AOT
        shell: bash
        run: |
          # Verification scripts otherwise fall back to the JIT build when an override is missing.
          rm -rf artifacts/bin
          test -x "$KEYPASTE_BIN" || { echo "::error::no AOT cli binary"; exit 1; }
          test -x "$KEYPASTE_MCP_BIN" || { echo "::error::no AOT mcp binary"; exit 1; }
          for stray in artifacts/release/linux-x64/*.dll artifacts/release/linux-x64/*.runtimeconfig.json; do
            [ -e "$stray" ] && { echo "::error::$stray exists, so this is a JIT apphost, not AOT"; exit 1; }
          done
          "$KEYPASTE_BIN" --version
          file "$KEYPASTE_BIN"

      - name: Verify run injects a variable and writes nothing to disk
        shell: bash
        run: scripts/verify-run-injection.sh

      - name: Verify run forwards signals and exit codes
        shell: bash
        run: scripts/verify-run-signals.sh

      - name: Verify keypaste-mcp speaks MCP over stdio and audits every call
        shell: bash
        run: scripts/verify-mcp-stdio.sh

      - name: Verify a person can approve and refuse across two real processes
        shell: bash
        run: scripts/verify-approval-e2e.sh

      - name: Verify the audit chain catches tampering and forgives a crash
        shell: bash
        run: scripts/verify-log-chain.sh

      - name: Verify the demo page still matches what the AOT binaries print
        shell: bash
        timeout-minutes: 8
        run: scripts/verify-demo.sh

      - name: Install KeePassXC
        run: sudo apt-get install -y --no-install-recommends keepassxc

      - name: Verify a vault written by the AOT binary opens in real KeePassXC
        shell: bash
        env:
          KP_COMPAT_PASSWORD: ci-master-pw
        run: |
          scripts/make-compat-fixture.sh artifacts/compat/aot.kdbx
          scripts/verify-keepassxc-compat.sh artifacts/compat/aot.kdbx
          scripts/verify-keepassxc-writeback.sh artifacts/compat/aot-writeback.kdbx
          # Keyfiles reach XmlSerializer, which trimming can remove; only the AOT binary shows it.
          scripts/verify-keepassxc-xml-attach.sh artifacts/compat/aot-xml-attach
          scripts/verify-keepassxc-keyfile.sh artifacts/compat/aot-keyfile.kdbx

  b4a-measure:
    name: 'B.4a measure (${{ matrix.rid }})'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
            python: python3
          - os: windows-2025
            rid: win-x64
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      PYTHON: ${{ matrix.python }}
      BASE_SHA: a432adea7aeb02ce8ce63742c7b24d33b6333836
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Publish the one binary
        run: |
          dotnet restore keypaste.slnx --locked-mode
          dotnet publish src/Keypaste.Cli/Keypaste.Cli.csproj -c Release -r "$RID" \
            --no-restore -o "$RUNNER_TEMP/one" 2>&1 | tee "$RUNNER_TEMP/one-cli.log"

      - name: Publish the two binaries of the base commit
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          cd "$RUNNER_TEMP/base"
          dotnet restore keypaste.slnx --locked-mode
          dotnet publish src/Keypaste.Cli/Keypaste.Cli.csproj -c Release -r "$RID" \
            --no-restore -o "$RUNNER_TEMP/two" 2>&1 | tee "$RUNNER_TEMP/two-cli.log"
          dotnet publish src/Keypaste.Mcp/Keypaste.Mcp.csproj -c Release -r "$RID" \
            --no-restore -o "$RUNNER_TEMP/two" 2>&1 | tee "$RUNNER_TEMP/two-mcp.log"

      - name: Compare trim diagnostics, size and start time
        run: |
          export LC_ALL=C
          diagnostics() { { grep -E 'IL[0-9]{4}' "$1" || true; } | sed -E 's/\r$//; s/ \[[^][]*\.csproj\]$//; s#\\#/#g; s#^.*/(third_party|src)/#\1/#' | sort -u; }
          for log in two-cli two-mcp one-cli; do
            echo "== $log: $(diagnostics "$RUNNER_TEMP/$log.log" | wc -l) IL diagnostics"
          done
          echo "== IL diagnostics of the one binary that the base CLI does not emit:"
          comm -13 <(diagnostics "$RUNNER_TEMP/two-cli.log") <(diagnostics "$RUNNER_TEMP/one-cli.log")
          ls -l "$RUNNER_TEMP/two" "$RUNNER_TEMP/one"
          if [ "$RUNNER_OS" = macOS ]; then
            "$PYTHON" scripts/b4a-measure.py "$RUNNER_TEMP/one" "$RUNNER_TEMP/two" 60 15 sudo purge
          else
            "$PYTHON" scripts/b4a-measure.py "$RUNNER_TEMP/one" "$RUNNER_TEMP/two" 60 0
          fi

  # PRODUCT law 4.6 and D-0008 require this blocking gate on all three operating systems.
  compat:
    name: keepassxc compat (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # KeePassXC's Windows console encoding can alter a non-ASCII master password.
      KP_COMPAT_PASSWORD: ci-master-pw
      KDBX: artifacts/compat/gen.kdbx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install keepassxc-cli (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends keepassxc

      - name: Install keepassxc-cli (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install --cask keepassxc

      - name: Install keepassxc-cli (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "KPXC_CLI=$(bash scripts/install-keepassxc-windows.sh)" >> "$GITHUB_ENV"

      - name: Restore (locked)
        run: dotnet restore keypaste.slnx --locked-mode

      - name: Build
        run: dotnet build keypaste.slnx --no-restore -c Release

      - name: Generate the fixture vault with the keypaste binary
        shell: bash
        run: scripts/make-compat-fixture.sh "${{ env.KDBX }}"

      - name: Verify it opens in real KeePassXC
        shell: bash
        run: scripts/verify-keepassxc-compat.sh "${{ env.KDBX }}"

      - name: Verify the write-back round trip through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-writeback.sh artifacts/compat/writeback.kdbx

      - name: Verify a restored revision and its history through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-history.sh artifacts/compat/history.kdbx

      - name: Verify reversible deletion and recovery through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-recyclebin.sh artifacts/compat/recyclebin.kdbx

      - name: Verify run refuses an expired or misnamed entry KeePassXC made
        shell: bash
        run: bash scripts/verify-keepassxc-run.sh artifacts/compat/run

      - name: Verify the backup a save keeps, a restore and an export through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-backup.sh artifacts/compat/backup.kdbx

      - name: Verify renaming and moving through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-organize.sh artifacts/compat/organize.kdbx

      - name: Verify importing a KeePassXC vault through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-import.sh artifacts/compat/import

      - name: Verify custom fields through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-fields.sh artifacts/compat/fields

      - name: Verify project tags and their protection through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-projects.sh artifacts/compat/projects

      - name: Verify opening a keyfile-protected vault through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-keyfile.sh artifacts/compat/keyfile.kdbx
