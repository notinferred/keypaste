name: ci

on:
  push:
    branches: [main]
    # Keep pages checked by verify-demo.sh out of this list; docs/** would also skip them.
    paths-ignore:
      - 'docs/PRODUCT.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'ROADMAP.md'
      - 'docs/STEPS.md'
      - 'docs/steps/**'
      - 'docs/ARCHITECTURE.md'
      - 'docs/BACKLOG.md'
      - 'docs/BRAND.md'
      - 'docs/FEATURES.md'
      - 'docs/decisions-archive.md'
      - 'docs/design/**'
      - 'docs/screenshots/**'
      - 'docs/demo/**'
      - 'DECISIONS.md'
      - 'CHANGELOG.md'
      - 'THREATS.md'
      - 'SECURITY.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'docs/mcp-setup.md'
      - 'docs/replace-dotenv.md'
      - 'docs/policy.md'
      - 'docs/approvals.md'
      - 'docs/desktop.md'
      - '.claude/**'
      - 'site/README.md'
      - 'site/schema.sql'
      - 'site/test/*.mjs'
      - 'site/public/_headers'
      - 'site/public/brand.css'
      - 'site/public/favicon.svg'
      - 'site/public/fonts/**'
      - 'site/public/demo/**'
      - 'site/public/thanks/**'
      - 'site/web/**'
      - 'site/.node-version'
  pull_request:
  workflow_dispatch:
  # Weekly, so a runner image or upstream change shows without a commit.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Release tags require a completed verdict for each commit on main; a branch's newer run supersedes its last.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  # Every run runs every job; a dispatch, the schedule or a tag's own run counts toward a release (D-0403, D-0423).
  checks:
    name: scripts + workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The release matrix verifier checks published targets against repository history.
          fetch-depth: 0

      - name: Verify workflows
        shell: bash
        run: bash scripts/verify.sh workflows

      - name: Run the offline script fixtures
        shell: bash
        run: bash scripts/verify.sh scripts

      - name: Verify the release destination check fails closed against the real aws CLI
        shell: bash
        run: scripts/verify-release-destination.sh --with-real-aws

  # dotnet format reports what the build cannot, import order and this. qualification, once for every project.
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Check every project's format
        shell: bash
        run: bash scripts/verify.sh format

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build and test the backend solution
        shell: bash
        run: bash scripts/verify.sh backend

      - name: Verify the Windows PowerShell launcher selects Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/verify.ps1 --list

  # Real CLI, agent and bridge processes, and the demo pages against what the binaries print.
  integration:
    name: integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install GNU timeout (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: command -v gtimeout >/dev/null || brew install coreutils

      - name: Run the integration gate
        shell: bash
        run: bash scripts/verify.sh integration

  compat:
    name: compat (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # KeePassXC's Windows console encoding can alter a non-ASCII master password.
      KP_COMPAT_PASSWORD: ci-master-pw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore and build the backend solution
        shell: bash
        run: bash scripts/verify.sh backend --prepare-only

      # PRODUCT law 4.6 and D-0008 require this blocking gate on all three operating systems.
      # A stalled apt mirror otherwise holds the job for its whole limit.
      - name: Install keepassxc-cli (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          bash scripts/apt-install.sh --no-install-recommends keepassxc

      - name: Install keepassxc-cli (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install --cask keepassxc

      - name: Install keepassxc-cli (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "KPXC_CLI=$(bash scripts/install-keepassxc-windows.sh)" >> "$GITHUB_ENV"

      - name: Generate the fixture vault with the keypaste binary
        shell: bash
        run: scripts/make-compat-fixture.sh artifacts/compat/gen.kdbx

      - name: Verify it opens in real KeePassXC
        shell: bash
        run: scripts/verify-keepassxc-compat.sh artifacts/compat/gen.kdbx

      - name: Verify the write-back round trip through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-writeback.sh artifacts/compat/writeback.kdbx

      - name: Verify a restored revision and its history through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-history.sh artifacts/compat/history.kdbx

      - name: Verify reversible deletion and recovery through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-recyclebin.sh artifacts/compat/recyclebin.kdbx

      - name: Verify run refuses an expired or misnamed entry KeePassXC made
        shell: bash
        run: bash scripts/verify-keepassxc-run.sh artifacts/compat/run

      - name: Verify the backup a save keeps, a restore and an export through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-backup.sh artifacts/compat/backup.kdbx

      - name: Verify renaming and moving through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-organize.sh artifacts/compat/organize.kdbx

      - name: Verify importing a KeePassXC vault through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-import.sh artifacts/compat/import

      # The fields and projects gates ask the app's own prompt window, held by the app driver.
      - name: Restore (locked) and build the app driver
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tests/Keypaste.AppDriver/Keypaste.AppDriver.csproj --locked-mode
          dotnet build tests/Keypaste.AppDriver/Keypaste.AppDriver.csproj --no-restore -c Release

      # The fields gate shares through the site's Worker, run on loopback by wrangler.
      - name: Install the site's locked packages
        shell: bash
        timeout-minutes: 10
        run: npm ci --prefix site --no-audit --no-fund

      - name: Verify custom fields through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-fields.sh artifacts/compat/fields

      - name: Verify project tags and their protection through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-projects.sh artifacts/compat/projects

      - name: Verify opening a keyfile-protected vault through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-keyfile.sh artifacts/compat/keyfile.kdbx

  aot:
    name: aot publish (linux-x64)
    # NativeAOT inherits the build machine's glibc floor, which must match release.yml.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      KEYPASTE_BIN: artifacts/release/linux-x64/keypaste
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install the native toolchain
        run: bash scripts/apt-install.sh --no-install-recommends clang zlib1g-dev

      # Adding -r here narrows the RID set and invalidates the multi-RID lock file (D-0040).
      - name: Restore (locked)
        run: dotnet restore keypaste.slnx --locked-mode

      - name: Publish the CLI with NativeAOT
        run: |
          dotnet publish src/Keypaste.Cli/Keypaste.Cli.csproj -c Release -r linux-x64 \
            --no-restore -o artifacts/release/linux-x64 2>&1 | tee /tmp/publish-cli.log

      - name: Verify the AOT trim diagnostics still match the baseline
        shell: bash
        run: scripts/verify-aot-trim.sh /tmp/publish-cli.log

      - name: Point the gates at the AOT binaries and prove they are AOT
        shell: bash
        run: |
          # Verification scripts otherwise fall back to the JIT build when an override is missing.
          rm -rf artifacts/bin
          test -x "$KEYPASTE_BIN" || { echo "::error::no AOT cli binary"; exit 1; }
          for stray in artifacts/release/linux-x64/*.dll artifacts/release/linux-x64/*.runtimeconfig.json; do
            [ -e "$stray" ] && { echo "::error::$stray exists, so this is a JIT apphost, not AOT"; exit 1; }
          done
          "$KEYPASTE_BIN" --version
          file "$KEYPASTE_BIN"

      - name: Verify run injects a variable and writes nothing to disk
        shell: bash
        run: scripts/verify-run-injection.sh

      - name: Verify run forwards signals and exit codes
        shell: bash
        run: scripts/verify-run-signals.sh

      - name: Verify keypaste mcp speaks MCP over stdio and audits every call
        shell: bash
        run: scripts/verify-mcp-stdio.sh

      - name: Verify a person can approve and refuse across two real processes
        shell: bash
        run: scripts/verify-approval-e2e.sh

      - name: Verify the audit chain catches tampering and forgives a crash
        shell: bash
        run: scripts/verify-log-chain.sh

      - name: Verify the demo page still matches what the AOT binaries print
        shell: bash
        timeout-minutes: 8
        run: scripts/verify-demo.sh

      - name: Install KeePassXC
        run: bash scripts/apt-install.sh --no-install-recommends keepassxc

      - name: Verify a vault written by the AOT binary opens in real KeePassXC
        shell: bash
        env:
          KP_COMPAT_PASSWORD: ci-master-pw
        run: |
          scripts/make-compat-fixture.sh artifacts/compat/aot.kdbx
          scripts/verify-keepassxc-compat.sh artifacts/compat/aot.kdbx
          scripts/verify-keepassxc-writeback.sh artifacts/compat/aot-writeback.kdbx
          # Keyfiles reach XmlSerializer, which trimming can remove; only the AOT binary shows it.
          scripts/verify-keepassxc-xml-attach.sh artifacts/compat/aot-xml-attach
          scripts/verify-keepassxc-keyfile.sh artifacts/compat/aot-keyfile.kdbx

  # The one check a pull request needs green: a skipped job passes, a failed or cancelled one does not.
  ok:
    name: ci ok
    if: always()
    needs: [checks, format, test, integration, compat, aot]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when any job failed or was cancelled
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" > /dev/null; then
            echo "::error::a required job failed or was cancelled"
            exit 1
          fi
