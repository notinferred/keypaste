name: ci

on:
  # A branch push runs the fast tier, Linux only; main's push adds Windows; every other run adds macOS.
  push:
    branches: ['**']
    # Keep pages checked by verify-demo.sh out of this list; docs/** would also skip them.
    paths-ignore:
      - 'docs/PRODUCT.md'
      - 'CLAUDE.md'
      - 'ROADMAP.md'
      - 'docs/STEPS.md'
      - 'docs/steps/**'
      - 'docs/ARCHITECTURE.md'
      - 'docs/BACKLOG.md'
      - 'docs/DESIGN.md'
      - 'docs/DESIGN-PRINCIPLES.md'
      - 'docs/FEATURES.md'
      - 'docs/design/**'
      - 'docs/screenshots/**'
      - 'docs/demo/**'
      - 'CHANGELOG.md'
      - 'THREATS.md'
      - 'SECURITY.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'docs/mcp-setup.md'
      - 'docs/replace-dotenv.md'
      - 'docs/policy.md'
      - 'docs/approvals.md'
      - 'docs/desktop.md'
      - 'docs/safe-agents.md'
      - '.claude/**'
      - 'site/README.md'
      - 'site/schema.sql'
      - 'site/public/_headers'
      - 'site/public/brand.css'
      - 'site/public/favicon.svg'
      - 'site/public/fonts/**'
      - 'site/public/demo/**'
      - 'site/public/thanks/**'
      - 'site/public/acaf/**'
      - 'site/web/**'
      - 'site/.node-version'
  pull_request:
  workflow_dispatch:
    inputs:
      tools:
        description: Also install the real AI tools and connect keypaste to them; a release's dispatch sets it
        type: boolean
        default: false
      only_tools:
        description: Run only the tools jobs, for a step whose push already ran the rest; never counts toward a release (D-0468)
        type: boolean
        default: false
  # Weekly, so a runner image or upstream change shows without a commit.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

# On main and tags each commit and event has its own group, so a dispatch never waits behind its commit's push run and no
# pending run is replaced by a later one (D-0468).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && format('-{0}-{1}', github.sha, github.event_name) || '' }}
  # Release tags require a completed verdict for each commit on main; a branch's newer run supersedes its last.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  # Every run but a push runs every job on every runner but tools, which runs on the schedule and on a dispatch that asks
  # for it; a dispatch, the schedule or a tag's own run counts toward a release, ci's only with its tools jobs (D-0403, D-0438).
  # Only NuGet restores are cached, by every lock file's hash with no fallback key; release builds restore fresh (B.5).
  checks:
    name: scripts + workflows
    if: ${{ !inputs.only_tools }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The release matrix verifier checks published targets against repository history.
          fetch-depth: 0

      - name: Verify workflows
        shell: bash
        run: bash scripts/verify.sh workflows

      - name: Run the offline script fixtures
        shell: bash
        run: bash scripts/verify.sh scripts

      - name: Verify the release destination check fails closed against the real aws CLI
        shell: bash
        run: scripts/verify-release-destination.sh --with-real-aws

      # The share and crash routes against stand-ins for their databases, offline (D-0589).
      - name: Run the site's node tests
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          npm ci --prefix site --omit=dev --ignore-scripts --no-audit --no-fund
          npm test --prefix site

      # Packed and checked only; nothing uploads or publishes the bundle (G.6b).
      - name: Pack and check the Claude Desktop extension
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          bash scripts/build-claude-desktop-extension.sh "$version" "$RUNNER_TEMP/claude-desktop"

  # dotnet format reports what the build cannot, import order and this. qualification, once for every project.
  format:
    if: ${{ !inputs.only_tools }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}

      - name: Check every project's format
        shell: bash
        run: bash scripts/verify.sh format

  test:
    name: test (${{ matrix.os }})
    if: ${{ !inputs.only_tools }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'push' || github.ref == 'refs/heads/main') && '["ubuntu-24.04", "windows-2025"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}

      # Every branch push checks what KeePassXC reads of what keypaste writes (PRODUCT law 4.6).
      - name: Install keepassxc-cli (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/apt-install.sh --no-install-recommends keepassxc

      - name: Build and test the backend solution
        shell: bash
        env:
          KEYPASTE_KEEPASSXC: ${{ runner.os == 'Linux' && 'required' || '' }}
        run: bash scripts/verify.sh backend

      - name: Verify the Windows PowerShell launcher selects Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/verify.ps1 --list

  # Real CLI, agent and bridge processes, and the demo pages against what the binaries print.
  integration:
    name: integration (${{ matrix.os }})
    if: ${{ !inputs.only_tools }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'push' || github.ref == 'refs/heads/main') && '["ubuntu-24.04", "windows-2025"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}

      - name: Run the integration gate
        shell: bash
        run: bash scripts/verify.sh integration

  compat:
    name: compat (${{ matrix.os }})
    if: ${{ !inputs.only_tools && !(github.event_name == 'push' && github.ref != 'refs/heads/main') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}

      # PRODUCT law 4.6 and D-0008 require this blocking gate on all three operating systems.
      # A stalled apt mirror otherwise holds the job for its whole limit.
      - name: Install keepassxc-cli (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/apt-install.sh --no-install-recommends keepassxc

      - name: Install keepassxc-cli (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "KPXC_CLI=$(bash scripts/install-keepassxc.sh)" >> "$GITHUB_ENV"

      - name: Verify what keypaste writes against real KeePassXC
        shell: bash
        run: bash scripts/verify.sh compat

  # Hosted macOS runners are scarce and a job left queued is cancelled, so each workflow keeps its macOS work in one job.
  macos:
    name: backend, integration and compat (macos-15)
    if: ${{ !inputs.only_tools && github.event_name != 'push' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}

      - name: Install GNU timeout and keepassxc-cli
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -euo pipefail
          command -v gtimeout >/dev/null || brew install coreutils
          echo "KPXC_CLI=$(bash scripts/install-keepassxc.sh)" >> "$GITHUB_ENV"

      - name: Build and test the backend solution
        shell: bash
        env:
          KEYPASTE_KEEPASSXC: required
        run: bash scripts/verify.sh backend

      - name: Run the integration gate
        shell: bash
        run: bash scripts/verify.sh integration --test-only

      - name: Verify what keypaste writes against real KeePassXC
        shell: bash
        run: bash scripts/verify.sh compat

  aot:
    name: aot publish (linux-x64)
    if: ${{ !inputs.only_tools && !(github.event_name == 'push' && github.ref != 'refs/heads/main') }}
    # NativeAOT inherits the build machine's glibc floor, which must match release.yml.
    runs-on: ubuntu-22.04
    timeout-minutes: 19
    env:
      KEYPASTE_BIN: artifacts/release/linux-x64/keypaste
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}

      - name: Install the native toolchain
        run: bash scripts/apt-install.sh --no-install-recommends clang zlib1g-dev

      # As release.yml builds it; Linux carries none and finds the system's (D-0522).
      - name: Build the libargon2 the CLI carries
        shell: bash
        run: bash scripts/build-argon2.sh linux-x64

      # Linked into keypaste, which a publish without it refuses (D-0612).
      - name: Build the libsodium keypaste links
        shell: bash
        run: bash scripts/build-libsodium.sh linux-x64

      # Adding -r here narrows the RID set and invalidates the multi-RID lock file (D-0040).
      - name: Restore (locked)
        run: dotnet restore keypaste.slnx --locked-mode

      - name: Publish the CLI with NativeAOT
        shell: bash
        run: |
          dotnet publish src/Keypaste.Cli/Keypaste.Cli.csproj -c Release -r linux-x64 \
            --no-restore -o artifacts/release/linux-x64 2>&1 | tee /tmp/publish-cli.log

      - name: Verify the AOT trim diagnostics still match the baseline
        shell: bash
        run: scripts/verify-aot-trim.sh /tmp/publish-cli.log

      - name: Point the gates at the AOT binaries and prove they are AOT
        shell: bash
        run: |
          # Verification scripts otherwise fall back to the JIT build when an override is missing.
          rm -rf artifacts/bin
          test -x "$KEYPASTE_BIN" || { echo "::error::no AOT cli binary"; exit 1; }
          for stray in artifacts/release/linux-x64/*.dll artifacts/release/linux-x64/*.runtimeconfig.json; do
            [ -e "$stray" ] && { echo "::error::$stray exists, so this is a JIT apphost, not AOT"; exit 1; }
          done
          for stray in artifacts/release/linux-x64/libsodium*; do
            [ -e "$stray" ] && { echo "::error::$stray exists beside keypaste, which links libsodium"; exit 1; }
          done
          "$KEYPASTE_BIN" --version
          file "$KEYPASTE_BIN"
          # The NaCl box gives its known answers with the libsodium linked into it (D-0613).
          "$KEYPASTE_BIN" --selftest

      - name: Verify run injects a variable and writes nothing to disk
        shell: bash
        run: scripts/verify-run-injection.sh

      - name: Verify run forwards signals and exit codes
        shell: bash
        run: scripts/verify-run-signals.sh

      - name: Verify keypaste mcp speaks MCP over stdio and audits every call
        shell: bash
        run: scripts/verify-mcp-stdio.sh

      - name: Verify a person can approve and refuse across two real processes
        shell: bash
        run: scripts/verify-approval-e2e.sh

      - name: Verify agent rules hold across processes only as the owner sealed them
        shell: bash
        run: scripts/verify-policy-e2e.sh

      - name: Verify the audit chain catches tampering and forgives a crash
        shell: bash
        run: scripts/verify-log-chain.sh

      - name: Verify the demo page still matches what the AOT binaries print
        shell: bash
        timeout-minutes: 8
        run: scripts/verify-demo.sh

      - name: Install KeePassXC
        run: bash scripts/apt-install.sh --no-install-recommends keepassxc

      - name: Verify a vault written by the AOT binary opens in real KeePassXC
        shell: bash
        env:
          KP_COMPAT_PASSWORD: ci-master-pw
        run: |
          scripts/make-compat-fixture.sh artifacts/compat/aot.kdbx
          scripts/verify-keepassxc-compat.sh artifacts/compat/aot.kdbx
          scripts/verify-keepassxc-writeback.sh artifacts/compat/aot-writeback.kdbx
          # Keyfiles reach XmlSerializer, which trimming can remove; only the AOT binary shows it.
          scripts/verify-keepassxc-xml-attach.sh artifacts/compat/aot-xml-attach
          scripts/verify-keepassxc-keyfile.sh artifacts/compat/aot-keyfile.kdbx --cli-only

  # The AI tools keypaste connects, at the versions install-real-tools.sh pins, connected by keypaste setup, read back
  # with each tool's own command where it has one (VS Code's, Claude Desktop's and Windows Cursor's at the file level)
  # and removed again; on Linux and macOS, Codex's sandbox refuses an agent's write to keypaste's home (L.3).
  tools:
    name: tools (${{ matrix.os }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.tools || inputs.only_tools))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}

      - name: Install GNU timeout (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: command -v gtimeout >/dev/null || brew install coreutils

      - name: Install the real AI tools at their pinned versions
        shell: bash
        timeout-minutes: 15
        run: bash scripts/install-real-tools.sh "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Connect keypaste to every tool, read it back with the tool and remove it
        shell: bash
        run: bash scripts/verify.sh tools

  # The one check a pull request needs green: a skipped job passes, and any result but success or skipped does not.
  ok:
    name: ci ok
    if: always()
    needs: [checks, format, test, integration, compat, macos, aot, tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail unless every job succeeded or was skipped
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if ! jq -e 'all(.[]; . == "success" or . == "skipped")' <<< "$RESULTS" > /dev/null; then
            echo "::error::a required job neither succeeded nor was skipped"
            exit 1
          fi
