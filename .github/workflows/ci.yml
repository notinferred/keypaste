name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  # Formatting and analyzers are OS-independent, so they run once on Linux and
  # short-circuit the three-OS matrix rather than failing three times over.
  gate:
    name: format + analyzers
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore keypaste.slnx --locked-mode

      # third_party/ is excluded because vendored source is re-merged from upstream, not
      # formatted to our taste; reformatting it would turn every security bump into a
      # conflict. The quarantine that turns the analyzers off for it is
      # third_party/Directory.Build.props — an .editorconfig alone would not be enough,
      # because dotnet format reads .editorconfig but is not bound by MSBuild properties.
      - name: Verify formatting
        run: dotnet format keypaste.slnx --no-restore --verify-no-changes --exclude third_party/

      - name: Build
        run: dotnet build keypaste.slnx --no-restore -c Release -warnaserror

  test:
    name: test (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, blacksmith-4vcpu-windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore keypaste.slnx --locked-mode

      - name: Build
        run: dotnet build keypaste.slnx --no-restore -c Release

      - name: Test
        run: dotnet test keypaste.slnx --no-build -c Release

      # `keypaste run` hands the child keypaste's real stdin, stdout and stderr, which puts
      # everything it does beyond CliContext and therefore beyond every in-process test. The unit
      # tests assert the environment keypaste *builds*; these assert what a real child process
      # actually received, and that no file was written while doing it (CORE.md law 3.4).
      - name: Verify run injects a variable and writes nothing to disk
        shell: bash
        run: scripts/verify-run-injection.sh

      # Unix only: there is no kill(1) equivalent on Windows and no tty on a runner. That is a gap
      # in the test, not a relaxation of the gate — the Windows behaviour is stated in SECURITY.md
      # instead. Do not add an `if:` that can skip the Linux and macOS runs.
      - name: Verify run forwards signals and exit codes
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/verify-run-signals.sh

      # The in-process MCP tests drive the server through StreamServerTransport, so they never
      # exercise StdioServerTransport or Main — and "a client spawns it with redirected stdio and
      # no terminal" is the premise of the whole bridge. Only a real spawned process can be asked
      # what actually reached its stdout.
      - name: Verify keypaste-mcp speaks MCP over stdio and audits every call
        shell: bash
        run: scripts/verify-mcp-stdio.sh

      # Everything else runs the approver and the bridge inside one test host. This is the only
      # place a real `keypaste agent` unlocks a real vault in one process while a real
      # keypaste-mcp asks it over a real named pipe from another, and a person's yes or no decides
      # what comes back. That the credential crosses a process boundary is the premise of the whole
      # architecture (DECISIONS.md D-0023), and a premise nothing exercises is one nobody checks.
      - name: Verify a person can approve and refuse across two real processes
        shell: bash
        run: scripts/verify-approval-e2e.sh

      # The step above proves a person's yes and no cross a process boundary. This proves the
      # opposite, and it is the harder claim: that a rule the human wrote in advance releases a
      # credential with NO prompt at all, and that the same agent still draws one for anything the
      # rule does not cover. An absence cannot be observed in-process, and it is worth nothing
      # unless paired with a presence — which is why every phase here counts prompts before and
      # after (DECISIONS.md D-0028).
      #
      # The timeout is not decoration. This step starts three `keypaste agent` processes, each of
      # which blocks until it is stopped; one that outlives the script holds this step's handles open
      # and the job sits there until its own twenty-minute limit, long after every assertion passed.
      # Eight minutes turns that into a fast, obvious failure instead of a silent one.
      - name: Verify a policy rule grants without a prompt, and only inside its pattern
        shell: bash
        timeout-minutes: 8
        run: scripts/verify-policy-e2e.sh

      # The audit log is written by keypaste-mcp and read back by keypaste — two separate programs
      # that have to agree, byte for byte, about what a record is. That agreement is the whole of
      # THREATS.md T-5's mitigation, and the in-process tests cannot see it because they only ever
      # use one of the two. This step edits a real log on a real disk and asserts that the shipped
      # `keypaste log verify` notices, and, just as importantly, that an interrupted write and a
      # truncation are reported as what they are rather than as an attack. Without it, the chain
      # could pass every unit test while the two binaries disagreed about a single byte.
      - name: Verify the audit chain catches tampering and forgives a crash
        shell: bash
        run: scripts/verify-log-chain.sh

      # docs/demo.md is the marketing (CORE.md law 5.1), and the first thing a stranger does with a
      # demo page is type it in - so one that has quietly gone stale costs more than no page at all.
      # Nothing in-process can catch that: what drifts is a Markdown transcript, which no unit test
      # reads, and the approval dialog it reproduces exists only on the stderr of a second process.
      # This step drives the page's own fixture and a real agent and bridge, and diffs that dialog
      # against the block in the document character for character.
      #
      # It does not run Claude and says so in its own header and in the page's "Verifying it
      # yourself": what a model chooses to do is not a thing a gate can hold, and a check this
      # project asks strangers to trust must not depend on a paid networked service (D-0034).
      #
      # The timeout is not decoration - this step starts a `keypaste agent` that blocks until it is
      # stopped, and one that outlives the script would hold the step open until the job's own
      # twenty-minute limit, long after every assertion passed.
      - name: Verify the demo page still matches what the binaries print
        shell: bash
        timeout-minutes: 8
        run: scripts/verify-demo.sh

  # The release workflow ships NativeAOT binaries, and AOT's failure mode is a runtime
  # NotSupportedException rather than a build error — so a compile proves nothing and a tag must
  # never be the first time this is exercised. One RID here, natively, on every push: enough to
  # catch an AOT-hostile dependency the day it lands rather than on release day. The other three
  # RIDs are covered by release.yml, which runs this same suite against every published binary.
  #
  # ubuntu-22.04 deliberately, not 24.04: NativeAOT links against the build machine's glibc, and
  # 22.04's 2.35 is the floor the published Linux binaries are built to. Building the check on a
  # newer image than the release would make it a weaker test than the thing it is checking.
  aot:
    name: aot publish (linux-x64)
    needs: gate
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 25
    env:
      KEYPASTE_BIN: artifacts/release/linux-x64/keypaste
      KEYPASTE_MCP_BIN: artifacts/release/linux-x64/keypaste-mcp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Never with -r. A RID on the command line narrows the project's runtime identifier set to
      # one, which can never match a lock file recording four, and locked mode fails NU1004. The
      # csproj declares all four so one whole-solution restore covers every publish (D-0040).
      - name: Restore (locked)
        run: dotnet restore keypaste.slnx --locked-mode

      - name: Publish both binaries with NativeAOT
        run: |
          dotnet publish src/Keypaste.Cli/Keypaste.Cli.csproj -c Release -r linux-x64 \
            --no-restore -o artifacts/release/linux-x64 2>&1 | tee /tmp/publish-cli.log
          dotnet publish src/Keypaste.Mcp/Keypaste.Mcp.csproj -c Release -r linux-x64 \
            --no-restore -o artifacts/release/linux-x64 2>&1 | tee /tmp/publish-mcp.log

      # third_party/Directory.Build.props disarms the trim analyzers for vendored source, which is
      # what O-0006 objected to. This puts the gate back: the diagnostics are diffed against a
      # committed baseline, so an upstream re-merge that adds AOT-hostile code is a red build.
      - name: Verify the AOT trim diagnostics still match the baseline
        shell: bash
        run: scripts/verify-aot-trim.sh /tmp/publish-cli.log /tmp/publish-mcp.log

      # Everything below runs against the published native binaries, not the ordinary build. The
      # rm is load-bearing: artifacts/bin is exactly where the scripts look when the environment
      # variables are unset, so without it a typo in either name would silently test the JIT build
      # and pass. The assertions after it are the cheap discriminator between the two.
      - name: Point the gates at the AOT binaries and prove they are AOT
        shell: bash
        run: |
          rm -rf artifacts/bin
          test -x "$KEYPASTE_BIN" || { echo "::error::no AOT cli binary"; exit 1; }
          test -x "$KEYPASTE_MCP_BIN" || { echo "::error::no AOT mcp binary"; exit 1; }
          for stray in artifacts/release/linux-x64/*.dll artifacts/release/linux-x64/*.runtimeconfig.json; do
            [ -e "$stray" ] && { echo "::error::$stray exists, so this is a JIT apphost, not AOT"; exit 1; }
          done
          "$KEYPASTE_BIN" --version
          file "$KEYPASTE_BIN"

      - name: Verify run injects a variable and writes nothing to disk
        shell: bash
        run: scripts/verify-run-injection.sh

      - name: Verify run forwards signals and exit codes
        shell: bash
        run: scripts/verify-run-signals.sh

      - name: Verify keypaste-mcp speaks MCP over stdio and audits every call
        shell: bash
        run: scripts/verify-mcp-stdio.sh

      - name: Verify a person can approve and refuse across two real processes
        shell: bash
        run: scripts/verify-approval-e2e.sh

      - name: Verify the audit chain catches tampering and forgives a crash
        shell: bash
        run: scripts/verify-log-chain.sh

      - name: Verify the demo page still matches what the AOT binaries print
        shell: bash
        timeout-minutes: 8
        run: scripts/verify-demo.sh

      # CORE.md law 4.6 applied to the artifact strangers will actually run. The vault writer goes
      # through vendored KeePassLib's XML, Argon2 and AES, which is the code most likely to be
      # broken by trimming — so an AOT binary that has not written a KDBX a real KeePassXC can
      # open has not been tested at all.
      - name: Install KeePassXC
        run: sudo apt-get install -y --no-install-recommends keepassxc

      - name: Verify a vault written by the AOT binary opens in real KeePassXC
        shell: bash
        env:
          KP_COMPAT_PASSWORD: ci-master-pw
        run: |
          scripts/make-compat-fixture.sh artifacts/compat/aot.kdbx
          scripts/verify-keepassxc-compat.sh artifacts/compat/aot.kdbx
          scripts/verify-keepassxc-writeback.sh artifacts/compat/aot-writeback.kdbx

  # ===========================================================================
  # PERMANENT COMPATIBILITY GATE — CORE.md law 4.6:
  #   "Compatibility is sacred: any KDBX file keypaste writes must open
  #    correctly in KeePassXC. This is tested in CI against real KeePassXC."
  #
  # CORE.md is the one file in this repository that cannot change, so neither
  # can the existence of this job. It is not subject to the usual "delete it if
  # it is annoying" latitude that applies to every other CI step.
  #
  # If it is failing, keypaste's vault writer is wrong. Do NOT:
  #   - delete this job,
  #   - add continue-on-error,
  #   - add an `if:` that can skip it,
  #   - or drop an operating system from the matrix,
  # to make the build green. DECISIONS.md D-0008 records the reasoning and the
  # three properties that must survive any edit here.
  # ===========================================================================
  compat:
    name: keepassxc compat (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, blacksmith-4vcpu-windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # ASCII-only on purpose. keepassxc-cli forces the Windows console code page to the
      # system ANSI page, so a non-ASCII master password is the one value that could be
      # mangled in transit. Non-ASCII *entry* values are still asserted, by the fixture.
      KP_COMPAT_PASSWORD: ci-master-pw
      # Repo-relative on purpose. github.workspace is a backslash path on Windows, which does
      # not survive being quoted into a bash script; steps already run from the workspace root.
      KDBX: artifacts/compat/gen.kdbx
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Linux and macOS take the distro/Homebrew build. The version floats with the runner
      # image, which is correct semantics: the claim is "opens in KeePassXC", not "opens in
      # one build of it", and a slightly older reader is free extra coverage.
      - name: Install keepassxc-cli (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends keepassxc

      - name: Install keepassxc-cli (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install --cask keepassxc

      # Windows has no packaged CLI that lands on PATH usefully, so we fetch the official
      # portable zip and pin it by SHA-256. The MSI would set only the *machine* PATH, which
      # the already-running job does not observe, so it would buy nothing over an absolute
      # path while costing an installer.
      #
      # The binary is invoked by absolute path rather than added to $GITHUB_PATH because the
      # portable build resolves Qt5Core.dll / argon2.dll / botan-3.dll from its own directory.
      - name: Install keepassxc-cli (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          KPXC_VERSION: 2.7.12
          # Pinned in-repo rather than trusted from the release's own .DIGEST: that file is
          # served from the same origin as the zip, so it proves integrity but not
          # authenticity. A constant here changes only through a reviewed diff.
          # Matches the published DIGEST for KeePassXC-2.7.12-Win64.zip.
          KPXC_SHA256: 958234b0669d757b53eacf42bdd5de0fa1cc1ab7527709ddf4f7e29c06a8305f
        run: |
          set -euo pipefail
          zip="KeePassXC-${KPXC_VERSION}-Win64.zip"
          url="https://github.com/keepassxreboot/keepassxc/releases/download/${KPXC_VERSION}/${zip}"
          curl -fsSL -o "$zip" "$url"

          observed=$(sha256sum "$zip" | cut -d' ' -f1)
          echo "observed sha256: $observed"
          if [ "$observed" != "$KPXC_SHA256" ]; then
            echo "::error::SHA-256 mismatch for ${zip}: expected ${KPXC_SHA256}, got ${observed}"
            exit 1
          fi

          # Git Bash ships no unzip, and its own /usr/bin/tar is GNU tar, which cannot read a
          # zip and wins the PATH lookup under `shell: bash`. Windows' bundled bsdtar reads
          # zip natively, so call it by absolute path rather than trusting resolution order.
          bsdtar="/c/Windows/System32/tar.exe"
          [ -x "$bsdtar" ] || { echo "::error::$bsdtar not found"; exit 1; }
          "$bsdtar" -xf "$zip"

          # $(pwd) rather than $GITHUB_WORKSPACE: Git Bash reports a POSIX path (/d/a/...),
          # whereas GITHUB_WORKSPACE is a backslash path that bash would mangle when quoted.
          echo "KPXC_CLI=$(pwd)/KeePassXC-${KPXC_VERSION}-Win64/keepassxc-cli.exe" >> "$GITHUB_ENV"

      - name: Restore (locked)
        run: dotnet restore keypaste.slnx --locked-mode

      - name: Build
        run: dotnet build keypaste.slnx --no-restore -c Release

      # Driven through the shipped keypaste binary rather than a throwaway harness, so the gate
      # covers argument parsing, group paths, the redirected-stdin prompt, and add's
      # open-modify-save cycle as well as the vault writer (DECISIONS.md D-0012).
      - name: Generate the fixture vault with the keypaste binary
        shell: bash
        run: scripts/make-compat-fixture.sh "${{ env.KDBX }}"

      # shell: bash on all three runners, so one assertion script serves the whole matrix.
      - name: Verify it opens in real KeePassXC
        shell: bash
        run: scripts/verify-keepassxc-compat.sh "${{ env.KDBX }}"

      # The other direction, and the other moment in a file's life: keypaste modifying an entry
      # (which writes KDBX history for the first time), and KeePassXC editing and adding env
      # variables that keypaste must then read. This is the claim the env convention was chosen
      # for, so it is gated, not assumed (DECISIONS.md D-0014).
      #
      # Builds its own vault: the fixture above is asserted against an exact `ls -R -f` tree, and
      # mutating it here would couple the two gates.
      - name: Verify the write-back round trip through real KeePassXC
        shell: bash
        run: bash scripts/verify-keepassxc-writeback.sh artifacts/compat/writeback.kdbx
