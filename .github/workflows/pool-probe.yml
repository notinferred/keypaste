name: pool-probe

# A green job means its measurements are readable; observed test failures remain in the artifacts.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Suite runs per shard (1-100; use 1 to validate instrumentation first)'
        default: '20'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  probe:
    name: pool (${{ matrix.arm }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        arm: [starved, as-found, relieved]
        shard: [1, 2, 3, 4]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate inputs and the result reader
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -euo pipefail
          if [[ ! "${ITERATIONS}" =~ ^([1-9][0-9]?|100)$ ]]; then
            echo "::error::iterations must be an integer from 1 to 100"
            exit 1
          fi
          bash scripts/probe-results.sh --selftest

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore keypaste.slnx --locked-mode

      - name: Build
        run: dotnet build keypaste.slnx --no-restore -c Release

      - name: Choose the arm's pool floor
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail

          # This runtime setting reads hexadecimal, so 100 requests a minimum of 256 workers.
          case "${ARM}" in
            starved)  echo 'DOTNET_ThreadPool_ForceMinWorkerThreads=1' >> "${GITHUB_ENV}" ;;
            relieved) echo 'DOTNET_ThreadPool_ForceMinWorkerThreads=100' >> "${GITHUB_ENV}" ;;
            as-found) : ;;
            *) echo "unknown arm ${ARM}"; exit 1 ;;
          esac

      - name: Retain the measured ref and environment
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
          SHARD: ${{ matrix.shard }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -euo pipefail
          mkdir -p probe-logs
          {
            printf 'run_id=%s\nrun_attempt=%s\nref=%s\nsha=%s\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_REF}" "${GITHUB_SHA}"
            printf 'arm=%s\nshard=%s\niterations=%s\n' "${ARM}" "${SHARD}" "${ITERATIONS}"
            printf 'runner_os=%s\nrunner_arch=%s\nimage=%s\nimage_version=%s\n' \
              "${RUNNER_OS}" "${RUNNER_ARCH}" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'DOTNET_ThreadPool_ForceMinWorkerThreads=%s\nDOTNET_ThreadPool_ForceMaxWorkerThreads=%s\nDOTNET_PROCESSOR_COUNT=%s\n' \
              "${DOTNET_ThreadPool_ForceMinWorkerThreads:-unset}" \
              "${DOTNET_ThreadPool_ForceMaxWorkerThreads:-unset}" "${DOTNET_PROCESSOR_COUNT:-unset}"
            dotnet --info
          } > "probe-logs/environment-${ARM}-${SHARD}.txt"

      - name: Prove the timeline reaches the test host
        shell: bash
        env:
          KEYPASTE_F9_TIMELINE: ${{ github.workspace }}/probe-timeline/preflight
        run: |
          set -uo pipefail
          preflight_exit=0
          dotnet test keypaste.slnx --no-build -c Release > preflight.log 2>&1 || preflight_exit=$?
          printf 'preflight_exit=%s\n' "${preflight_exit}" > preflight-status.txt

          written=0
          if [ -d probe-timeline/preflight ]; then
            written="$(find probe-timeline/preflight -name 'f9-timeline-*.jsonl' -size +0c | wc -l)"
          fi

          if [ "${written}" -eq 0 ]; then
            echo "::error::KEYPASTE_F9_TIMELINE did not reach the test host: no non-empty f9-timeline-*.jsonl was written."
            echo "Every participating assembly marks the timeline from a module initializer, so a process that"
            echo "started at all leaves a file. An empty directory means the variable did not arrive, and the"
            echo "counts this arm would go on to produce could not be correlated with anything."
            exit 1
          fi

          if ! jq -e -s 'map(.asm) | unique | contains(["Keypaste.Core.Tests", "Keypaste.Mcp.Tests"])' \
            probe-timeline/preflight/f9-timeline-*.jsonl > /dev/null; then
            echo "::error::timeline preflight needs valid JSON from both Core and Mcp test hosts"
            exit 1
          fi
          echo "timeline preflight: ${written} file(s), both participating assemblies present"

      - name: Probe
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations }}
          SHARD: ${{ matrix.shard }}
          ARM: ${{ matrix.arm }}
          KEYPASTE_F9_DUMP: '1'
        run: |
          set -uo pipefail
          mkdir -p probe-logs

          # Uploaded triage dumps must not inherit runner credentials.
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN
          failed=0
          control=''
          results="probe-logs/results-${ARM}-${SHARD}.tsv"
          printf 'iteration\toutcome\telapsed_seconds\n' > "${results}"

          for i in $(seq 1 "${ITERATIONS}"); do
            log="probe-logs/${ARM}-shard-${SHARD}-run-${i}.log"
            export KEYPASTE_F9_TIMELINE="${GITHUB_WORKSPACE}/probe-timeline/${ARM}-${SHARD}-${i}"
            started_at="$(date +%s)"

            if dotnet test keypaste.slnx --no-build -c Release > "${log}" 2>&1; then
              outcome=passed
              rm -f "${log}"

              # A passing control distinguishes ordinary cross-assembly overlap from failure evidence.
              if [ -z "${control}" ]; then
                control="${GITHUB_WORKSPACE}/probe-timeline/control-${ARM}-${SHARD}"
                mv "${KEYPASTE_F9_TIMELINE}" "${control}"
              else
                rm -rf "${KEYPASTE_F9_TIMELINE}"
              fi
            else
              outcome=failed
              failed=$((failed + 1))
              echo "::group::${ARM} shard ${SHARD} iteration ${i} failed"
              tail -n 80 "${log}"
              echo "::endgroup::"
            fi
            printf '%s\t%s\t%s\n' "${i}" "${outcome}" "$(( $(date +%s) - started_at ))" >> "${results}"
          done

          echo "${ARM} shard ${SHARD}: ${failed} of ${ITERATIONS} runs failed" | tee -a "${GITHUB_STEP_SUMMARY}"

          shapes="probe-logs/shapes-${ARM}-${SHARD}.txt"
          : > "${shapes}"

          if [ "${failed}" -gt 0 ]; then
            if ! bash scripts/probe-results.sh probe-logs/*-run-*.log > "${shapes}"; then
              echo "::error::${failed} run(s) failed, but their shapes could not be completely read; see the artifact"
              echo "${ARM} shard ${SHARD}: ${failed} failed; measurement INCOMPLETE" >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
            echo "${ARM} shard ${SHARD} shapes:" | tee -a "${GITHUB_STEP_SUMMARY}"
            sed 's/^/    /' "${shapes}" | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pool-probe-${{ matrix.arm }}-${{ matrix.shard }}
          path: |
            probe-logs/
            probe-timeline/
            preflight.log
            preflight-status.txt
          if-no-files-found: ignore
