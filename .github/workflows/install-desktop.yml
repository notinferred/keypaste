name: install-desktop
run-name: ${{ inputs.rehearsal && format('install-desktop rehearsal of app run {0} (not release evidence)', inputs.app_run_id) || format('install-desktop {0}', inputs.tag) }}

# 4.7b, 4.7e: installs a tag's attested desktop candidates on fresh runners and exercises the installed app from
# outside its process (D-0199), then checks that a new terminal runs the keypaste the MSI put on the user PATH
# or Settings linked (G.5). On macOS the DMG is quarantined as a browser download, and Gatekeeper must refuse
# the copy in /Applications before the documented override clears it. The candidates are app.yml's workflow
# artifacts from that tag's run, and the CLI/MCP is the same tag's published release; both are verified before
# anything is installed.
#
# A rehearsal installs instead the -dryrun packages of a successful app.yml run at this run's own commit, with
# the CLI/MCP from that run's archive beside them. Nothing in it is attested, so it is never release evidence;
# a candidate is tagged only after its rehearsal passes (D-0433).
#
# R.1a: in the same installed app, exercise-desktop-acts.sh then performs R.1a's acts, with KeePassXC, Claude Code
# at install-real-tools.sh's pin and, on Linux, xterm for the app's Run, none of which the app needs, and the job
# summary carries each act's verdict. dev.yml's acts mode calls this with dev: any successful app run's packages,
# installed as a rehearsal installs them and acted on with the calling ref's scripts, on one runner or all; it is
# never evidence of anything (D-0460).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The candidate tag, such as v0.5.0-rc.1. Its CLI/MCP must be in release-targets.json published[]. Empty for a rehearsal.'
        required: false
        type: string
      app_run_id:
        description: "The app.yml run whose app-win-x64, app-linux-x64 and app-osx-arm64 artifacts are the candidates: the tag's, or for a rehearsal a successful run at this branch's commit."
        required: true
        type: string
      rehearsal:
        description: "Install the packages a branch's app run built; never release evidence."
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      app_run_id:
        description: The successful app.yml run whose packages are installed and acted on
        required: true
        type: string
      rehearsal:
        description: Install the -dryrun packages a branch's app run built
        required: false
        type: boolean
        default: true
      dev:
        description: Any app run's packages, acted on with this ref's scripts; never evidence
        required: false
        type: boolean
        default: true
      runner:
        description: windows-2025, ubuntu-24.04 or macos-15, or all three
        required: false
        type: string
        default: all

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  install:
    name: install-desktop (${{ matrix.rid }})
    strategy:
      fail-fast: false
      # Every runner, or for dev.yml the one it names.
      matrix:
        include: >-
          ${{ fromJSON(
          inputs.runner == 'windows-2025' && '[{"os":"windows-2025","rid":"win-x64","package":"msi","cli":"zip"}]'
          || inputs.runner == 'ubuntu-24.04' && '[{"os":"ubuntu-24.04","rid":"linux-x64","package":"AppImage","cli":"tar.gz"}]'
          || inputs.runner == 'macos-15' && '[{"os":"macos-15","rid":"osx-arm64","package":"dmg","cli":"tar.gz"}]'
          || '[{"os":"windows-2025","rid":"win-x64","package":"msi","cli":"zip"},{"os":"ubuntu-24.04","rid":"linux-x64","package":"AppImage","cli":"tar.gz"},{"os":"macos-15","rid":"osx-arm64","package":"dmg","cli":"tar.gz"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    # The install exercise's slowest green job took 2 minutes; the acts' are not known yet, so this is generous until
    # they are, and then about twice the slowest green.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the dev run's app run succeeded (never evidence)
        if: inputs.dev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.app_run_id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::$RUN_ID is not a run ID"; exit 1 ;; esac
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.path, (.conclusion // "none"), .head_sha] | @tsv' | tr -d '\r')"
          IFS=$'\t' read -r path conclusion sha <<< "$run"
          [ "$path" = .github/workflows/app.yml ] || { echo "::error::run $RUN_ID is $path, not app.yml"; exit 1; }
          [ "$conclusion" = success ] || { echo "::error::app run $RUN_ID concluded $conclusion, not success"; exit 1; }
          echo "app run $RUN_ID built $sha; this dev run acts on it with $GITHUB_SHA's scripts and is never evidence"

      - name: Read the candidate version
        id: v
        if: ${{ !inputs.rehearsal }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.app_run_id }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "::error::an install that is not a rehearsal names the candidate's tag"; exit 1; }
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$TAG is not a version tag"; exit 1 ;; esac
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::$RUN_ID is not a run ID"; exit 1 ;; esac
          version="${TAG#v}"
          listed="$(jq -r --arg v "$version" '[.published[] | select(.version == $v and .provenance == true)] | length' release-targets.json | tr -d '\r')"
          [ "$listed" = 1 ] || { echo "::error::$version is not a published, attested CLI/MCP release in release-targets.json"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The harness and the packages then come from one commit.
      - name: Check the rehearsal's app run built this commit
        if: inputs.rehearsal && !inputs.dev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.app_run_id }}
        run: |
          set -euo pipefail
          [ -z "$TAG" ] || { echo "::error::a rehearsal installs a branch build and takes no tag, not $TAG"; exit 1; }
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::$RUN_ID is not a run ID"; exit 1 ;; esac
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.path, (.conclusion // "none"), .head_sha] | @tsv' | tr -d '\r')"
          IFS=$'\t' read -r path conclusion sha <<< "$run"
          [ "$path" = .github/workflows/app.yml ] || { echo "::error::run $RUN_ID is $path, not app.yml"; exit 1; }
          [ "$conclusion" = success ] || { echo "::error::app run $RUN_ID concluded $conclusion, not success"; exit 1; }
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::app run $RUN_ID built $sha, and this rehearsal runs at $GITHUB_SHA"; exit 1; }
          echo "app run $RUN_ID built $sha and succeeded"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-${{ matrix.rid }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.app_run_id }}
          github-token: ${{ github.token }}

      # A tag's build never carries -dryrun, the suffix app.yml gives a branch build's packages.
      - name: Read the rehearsal's package version
        id: rv
        if: inputs.rehearsal
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # macOS runs this under its stock bash 3.2, which has no mapfile (D-0398).
          found="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name "keypaste-app-*-dryrun-$RID-internal-unsigned.$PACKAGE")"
          count="$(printf '%s' "$found" | grep -c . || true)"
          [ "$count" = 1 ] || { echo "::error::app-$RID holds $count -dryrun $PACKAGE packages, not one"; exit 1; }
          version="$(basename "$found")"
          version="${version#keypaste-app-}"
          version="${version%-"$RID"-internal-unsigned."$PACKAGE"}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download and verify the tag's CLI/MCP release anonymously
        if: ${{ !inputs.rehearsal }}
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          RID: ${{ matrix.rid }}
          EXT: ${{ matrix.cli }}
        run: |
          set -euo pipefail
          scripts/verify-provenance.sh "$VERSION" "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/cli"
          archive="$RUNNER_TEMP/release/keypaste-$VERSION-$RID.$EXT"
          if [ "$EXT" = zip ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w "$RUNNER_TEMP/cli")'"
          else
            tar -xzf "$archive" -C "$RUNNER_TEMP/cli"
          fi

      # publish-desktop-bridge.sh built it in the same job, from the project release.yml publishes.
      - name: Unpack the CLI/MCP from the rehearsal's archive
        if: inputs.rehearsal
        shell: bash
        env:
          VERSION: ${{ steps.rv.outputs.version }}
          RID: ${{ matrix.rid }}
          EXT: ${{ matrix.cli }}
        run: |
          set -euo pipefail
          name="keypaste-app-$VERSION-$RID.$EXT"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$RUNNER_TEMP/candidate" && sha256sum -c "$name.sha256")
          else
            (cd "$RUNNER_TEMP/candidate" && shasum -a 256 -c "$name.sha256")
          fi
          mkdir -p "$RUNNER_TEMP/cli"
          archive="$RUNNER_TEMP/candidate/$name"
          if [ "$EXT" = zip ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w "$RUNNER_TEMP/cli")'"
          else
            tar -xzf "$archive" -C "$RUNNER_TEMP/cli"
          fi

      # The harness observes and drives the app; it is not something the app needs.
      - name: Install the Linux harness (Xvfb, openbox, AT-SPI client, xdotool, ImageMagick)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apt-install.sh --no-install-recommends xvfb openbox xdotool imagemagick dbus-daemon dbus-x11 \
            at-spi2-core python3-gi gir1.2-atspi-2.0 libglib2.0-bin

      # docs/desktop.md's Linux prerequisites, and nothing else the app is given.
      - name: Install the Linux app prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apt-install.sh --no-install-recommends libx11-6 libice6 libsm6 libfontconfig1 fuse3

      - name: Start Xvfb and openbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x800x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
          DISPLAY=:99 openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
          sleep 2

      - name: Install and exercise the candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version || steps.rv.outputs.version }}
          REHEARSAL: ${{ inputs.rehearsal && inputs.app_run_id || '' }}
          RID: ${{ matrix.rid }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate/keypaste-app-$VERSION-$RID-internal-unsigned.$PACKAGE"
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash scripts/exercise-desktop-install.sh "$RID" "$candidate" "$VERSION" "$RUNNER_TEMP/cli" install-desktop
          else
            bash scripts/exercise-desktop-install.sh "$RID" "$candidate" "$VERSION" "$RUNNER_TEMP/cli" install-desktop
          fi

      # The acts run in the app the install exercise left installed, whatever its checks found; each act says what it
      # could not reach.
      - name: Install KeePassXC and a terminal for the acts (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apt-install.sh --no-install-recommends keepassxc xterm

      - name: Install KeePassXC for the acts (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install --cask keepassxc

      - name: Install KeePassXC for the acts (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "KPXC_CLI=$(bash scripts/install-keepassxc-windows.sh "$RUNNER_TEMP/keepassxc")" >> "$GITHUB_ENV"

      - name: Install Claude Code where its native installer puts it
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-real-tools.sh --claude-code-only "$HOME/.local" >> "$GITHUB_PATH"

      # The scripts job checks it under Linux's bash; macOS classifies the acts with its stock 3.2 (D-0398).
      - name: Self-test the acts' classifier under macOS's bash
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        run: bash scripts/exercise-desktop-acts.sh --selftest

      - name: Perform R.1a's acts in the installed app
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version || steps.rv.outputs.version }}
          REHEARSAL: ${{ inputs.rehearsal && inputs.app_run_id || '' }}
          APP_RUN_ID: ${{ inputs.app_run_id }}
          RID: ${{ matrix.rid }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          PACKAGE_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APP_RUN_ID" --jq .head_sha | tr -d '\r')"
          export PACKAGE_COMMIT
          candidate="$RUNNER_TEMP/candidate/keypaste-app-$VERSION-$RID-internal-unsigned.$PACKAGE"
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash scripts/exercise-desktop-acts.sh "$RID" "$candidate" install-desktop "$RUNNER_TEMP/cli" acts
          else
            bash scripts/exercise-desktop-acts.sh "$RID" "$candidate" install-desktop "$RUNNER_TEMP/cli" acts
          fi

      - name: Write the acts' verdicts to the job summary
        if: always()
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          if [ -s acts/verdicts.jsonl ]; then
            bash scripts/exercise-desktop-acts.sh --summary acts >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The acts left no verdicts on $RID." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.dev && 'install-desktop-dev' || inputs.rehearsal && 'install-desktop-rehearsal' || 'install-desktop' }}-${{ matrix.rid }}
          path: install-desktop/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.dev && 'acts-dev' || inputs.rehearsal && 'acts-rehearsal' || 'acts' }}-${{ matrix.rid }}
          path: acts/
          if-no-files-found: warn
          retention-days: 30

