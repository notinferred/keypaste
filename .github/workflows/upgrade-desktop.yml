name: upgrade-desktop
run-name: ${{ inputs.rehearsal && 'upgrade-desktop rehearsal (not release evidence)' || format('upgrade-desktop with CLI/MCP {0}', inputs.cli_version) }}

# 4.7d, 4.7e2: builds three unpublished desktop candidates from one commit at distinct numeric versions, then on a
# fresh runner installs the lowest, fills a real vault and ~/.keypaste through the published CLI/MCP, upgrades,
# interrupts an upgrade, refuses a downgrade and uninstalls, checking the user's data after every transition.
# After each one a new terminal must run the keypaste the installed app carries (G.5): on Windows through the
# user PATH entry the MSI keeps once and removes on uninstall, on Linux through the link the lower app's
# Settings made, which a start of the higher image re-points, one handed to the running lower app included,
# and on macOS through the /usr/local/bin link, which names the bundle's fixed path that an upgrade replaces.
#
# Distinct numeric versions because an MSI ProductVersion and a bundle version are numeric and two candidates of
# one version cannot be ordered (D-0139, D-0147). Nothing here is attested, published or signed: these candidates exist only to
# be installed over one another. Public downloads and their upgrade evidence are 4.7c.
#
# A rehearsal makes the data with a CLI/MCP the build job publishes from this run's own commit instead of a
# published release. It is never release evidence; a candidate is tagged only after its rehearsal passes
# (D-0433).

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'The published CLI/MCP release that makes the fixture, such as 0.5.0-rc.1. Empty for a rehearsal.'
        required: false
        type: string
      rehearsal:
        description: 'Make the fixture with a CLI/MCP built from this commit; never release evidence.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: candidates (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore keypaste.app.slnx --locked-mode

      - name: Install the AppImage build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apt-install.sh --no-install-recommends squashfs-tools desktop-file-utils file clang zlib1g-dev

      # One commit, three versions: the lower one is installed, the higher upgrades it, and the third
      # is the install that fails partway.
      - name: Build the three candidates
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          bash scripts/build-upgrade-candidates.sh "$RID" artifacts/dist 0.0.1 0.0.2 0.0.3
          ls -l artifacts/dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-candidates-${{ matrix.rid }}
          path: artifacts/dist/
          if-no-files-found: error
          retention-days: 7

      # The project release.yml publishes for the CLI/MCP archives.
      - name: Build the rehearsal's fixture CLI/MCP
        if: inputs.rehearsal
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/fixture-cli
          bash scripts/publish-desktop-bridge.sh "$RID" artifacts/fixture-cli

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.rehearsal
        with:
          name: fixture-cli-${{ matrix.rid }}
          path: artifacts/fixture-cli/
          if-no-files-found: error
          retention-days: 7

  exercise:
    name: upgrade-desktop (${{ matrix.rid }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            cli: zip
          - os: ubuntu-24.04
            rid: linux-x64
            cli: tar.gz
          - os: macos-15
            rid: osx-arm64
            cli: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Before anything that can fail, so a setup failure still has a directory to upload from.
      - name: Make the records directory
        shell: bash
        run: mkdir -p upgrade-desktop

      - name: Read the CLI/MCP version
        id: v
        if: ${{ !inputs.rehearsal }}
        shell: bash
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          set -euo pipefail
          [ -n "$CLI_VERSION" ] || { echo "::error::an upgrade check that is not a rehearsal names the published CLI/MCP release that makes its fixture"; exit 1; }
          case "$CLI_VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$CLI_VERSION is not a version"; exit 1 ;; esac
          listed="$(jq -r --arg v "$CLI_VERSION" '[.published[] | select(.version == $v and .provenance == true)] | length' release-targets.json | tr -d '\r')"
          [ "$listed" = 1 ] || { echo "::error::$CLI_VERSION is not a published, attested CLI/MCP release in release-targets.json"; exit 1; }
          echo "version=$CLI_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upgrade-candidates-${{ matrix.rid }}
          path: ${{ runner.temp }}/candidates

      - name: Download and verify the CLI/MCP release anonymously
        if: ${{ !inputs.rehearsal }}
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          RID: ${{ matrix.rid }}
          EXT: ${{ matrix.cli }}
        run: |
          set -euo pipefail
          scripts/verify-provenance.sh "$VERSION" "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/cli"
          archive="$RUNNER_TEMP/release/keypaste-$VERSION-$RID.$EXT"
          if [ "$EXT" = zip ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w "$RUNNER_TEMP/cli")'"
          else
            tar -xzf "$archive" -C "$RUNNER_TEMP/cli"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.rehearsal
        with:
          name: fixture-cli-${{ matrix.rid }}
          path: ${{ runner.temp }}/cli

      - name: Read the rehearsal's CLI/MCP version
        id: rv
        if: inputs.rehearsal
        shell: bash
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          set -euo pipefail
          [ -z "$CLI_VERSION" ] || { echo "::error::a rehearsal builds its CLI/MCP from this commit and takes no cli_version, not $CLI_VERSION"; exit 1; }
          # macOS runs this under its stock bash 3.2, which has no mapfile (D-0398).
          found="$(find "$RUNNER_TEMP/cli" -maxdepth 1 -type f \( -name keypaste -o -name keypaste.exe \))"
          count="$(printf '%s' "$found" | grep -c . || true)"
          [ "$count" = 1 ] || { echo "::error::fixture-cli holds $count keypaste programs, not one"; exit 1; }
          chmod +x "$found"
          version="$("$found" --version | tr -d '[:space:]')"
          case "$version" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::the fixture's CLI/MCP reports '$version', not a version"; exit 1 ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The harness drives the app; it is not something the app needs.
      - name: Install the Linux harness (Xvfb, openbox, AT-SPI client, xdotool)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apt-install.sh --no-install-recommends xvfb openbox xdotool dbus-daemon dbus-x11 \
            at-spi2-core python3-gi gir1.2-atspi-2.0 libglib2.0-bin

      # docs/desktop.md's Linux prerequisites; the AppImage needs FUSE to run at all (D-0205).
      - name: Install the Linux app prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apt-install.sh --no-install-recommends libx11-6 libice6 libsm6 libfontconfig1 fuse3

      - name: Install keepassxc-cli (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apt-install.sh --no-install-recommends keepassxc

      - name: Install keepassxc-cli (Windows and macOS)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "KPXC_CLI=$(bash scripts/install-keepassxc.sh "$RUNNER_TEMP")" >> "$GITHUB_ENV"

      - name: Start Xvfb and openbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x800x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
          DISPLAY=:99 openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
          sleep 2

      - name: Install, upgrade, interrupt, refuse and uninstall
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version || steps.rv.outputs.version }}
          REHEARSAL: ${{ inputs.rehearsal && '1' || '' }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash scripts/exercise-desktop-upgrade.sh "$RID" "$RUNNER_TEMP/candidates" "$VERSION" \
              "$RUNNER_TEMP/cli" upgrade-desktop
          else
            bash scripts/exercise-desktop-upgrade.sh "$RID" "$RUNNER_TEMP/candidates" "$VERSION" \
              "$RUNNER_TEMP/cli" upgrade-desktop
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.rehearsal && 'upgrade-desktop-rehearsal' || 'upgrade-desktop' }}-${{ matrix.rid }}
          path: upgrade-desktop/
          # A run that fails in setup has no records to upload, and losing the run over that would
          # take the failing log with it (run 35260785520).
          if-no-files-found: warn
          retention-days: 30

