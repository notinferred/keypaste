name: upgrade-desktop

# 4.7d: builds three unpublished desktop candidates from one commit at distinct numeric versions, then on a
# fresh runner installs the lowest, fills a real vault and ~/.keypaste through the published CLI/MCP, upgrades,
# interrupts an upgrade, refuses a downgrade and uninstalls, checking the user's data after every transition.
#
# Distinct numeric versions because an MSI ProductVersion is numeric and two candidates of one version cannot
# be ordered (D-0139, D-0147). Nothing here is attested, published or signed: these candidates exist only to
# be installed over one another. Public downloads and their upgrade evidence are 4.7c.

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'The published CLI/MCP release that makes the fixture, such as 0.3.0.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: candidates (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore keypaste.app.slnx --locked-mode

      - name: Install the AppImage build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends squashfs-tools desktop-file-utils file

      # One commit, three versions: the lower one is installed, the higher upgrades it, and the third
      # is the install that fails partway.
      - name: Build the three candidates
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          bash scripts/build-upgrade-candidates.sh "$RID" artifacts/dist 0.0.1 0.0.2 0.0.3
          ls -l artifacts/dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-candidates-${{ matrix.rid }}
          path: artifacts/dist/
          if-no-files-found: error
          retention-days: 7

  exercise:
    name: upgrade-desktop (${{ matrix.rid }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            cli: zip
          - os: ubuntu-24.04
            rid: linux-x64
            cli: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Before anything that can fail, so a setup failure still has a directory to upload from.
      - name: Make the records directory
        shell: bash
        run: mkdir -p upgrade-desktop

      - name: Read the CLI/MCP version
        id: v
        shell: bash
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          set -euo pipefail
          case "$CLI_VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$CLI_VERSION is not a version"; exit 1 ;; esac
          listed="$(jq -r --arg v "$CLI_VERSION" '[.published[] | select(.version == $v and .provenance == true)] | length' release-targets.json | tr -d '\r')"
          [ "$listed" = 1 ] || { echo "::error::$CLI_VERSION is not a published, attested CLI/MCP release in release-targets.json"; exit 1; }
          echo "version=$CLI_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upgrade-candidates-${{ matrix.rid }}
          path: ${{ runner.temp }}/candidates

      - name: Download and verify the CLI/MCP release anonymously
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          RID: ${{ matrix.rid }}
          EXT: ${{ matrix.cli }}
        run: |
          set -euo pipefail
          scripts/verify-provenance.sh "$VERSION" "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/cli"
          archive="$RUNNER_TEMP/release/keypaste-$VERSION-$RID.$EXT"
          if [ "$EXT" = zip ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w "$RUNNER_TEMP/cli")'"
          else
            tar -xzf "$archive" -C "$RUNNER_TEMP/cli"
          fi

      # docs/desktop.md's Linux prerequisites; the AppImage needs FUSE to run at all (D-0205).
      - name: Install the Linux app prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 libice6 libsm6 libfontconfig1 fuse3

      - name: Install keepassxc-cli (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends keepassxc

      - name: Install keepassxc-cli (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "KPXC_CLI=$(bash scripts/install-keepassxc-windows.sh "$RUNNER_TEMP")" >> "$GITHUB_ENV"

      - name: Install, upgrade, interrupt, refuse and uninstall
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          bash scripts/exercise-desktop-upgrade.sh "$RID" "$RUNNER_TEMP/candidates" "$VERSION" \
            "$RUNNER_TEMP/cli" upgrade-desktop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: upgrade-desktop-${{ matrix.rid }}
          path: upgrade-desktop/
          # A run that fails in setup has no records to upload, and losing the run over that would
          # take the failing log with it (run 35260785520).
          if-no-files-found: warn
          retention-days: 30
