name: site

# Deploys site/ to Cloudflare Workers and then asks keypaste.com whether the disclosure is actually
# on it.
#
# Both halves matter. verify-release-matrix.sh reads site/public/index.html at the checked-out ref
# and says so, so before this file existed the repository could be entirely green while the live
# page was older - and on 2026-09-11 it was: f69c393 added the 0.2.0 concurrent-save disclosure,
# nobody ran wrangler, and keypaste.com served a page missing it for the length of a day while every
# gate passed. D-0121 records that.
#
# The order is deliberate: the page is checked BEFORE it is deployed, against the checkout, so a
# non-compliant page does not go live in the first place. The check after the deploy is then about
# propagation and about deploys that did not come from here - a rollback, a dashboard edit, a run
# that stopped halfway.
#
# There is no pull_request trigger. A fork's pull request cannot read the deploy credential, and a
# proposed change must not reach production. `npx wrangler dev` and site/README.md are what review
# has.
#
# This is NOT a release gate. require-green-gates.sh requires `ci` plus every .components[].workflow
# in release-targets.json; the site is not a component and must not become one, because a Cloudflare
# outage would then block a CLI tag.

on:
  push:
    branches: [main]
    # Everything wrangler uploads, plus the two files that decide what this run concludes.
    # release-targets.json is here because verify-site-disclosure.sh reads the phrases and the
    # advertised version out of it, not only out of the page, so a definition-only edit can make the
    # live page non-compliant without site/ changing. It costs a redeploy of identical bytes, which
    # is cheap beside a disclosure nobody notices is stale.
    paths:
      - 'site/public/**'
      - 'site/src/**'
      - 'site/wrangler.jsonc'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'release-targets.json'
      - 'scripts/verify-site-disclosure.sh'
      - 'scripts/verify-site-endpoint.sh'
      - '.github/workflows/site.yml'
  # The live page can be stale for reasons no push describes - a half-finished run, a rollback, an
  # account change - and without this the only repair is an empty commit. CLAUDE.md: this file must
  # be on the default branch before it can be dispatched, and a dispatch may select another ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The deliberate inverse of ci.yml. A cancelled test run costs nothing; a cancelled deploy leaves
  # an account mid-upload. Serialised as well, so two pushes cannot interleave two versions of
  # public/ into one Worker.
  group: site-deploy
  cancel-in-progress: false

env:
  # One owner for the URL. Both gates default to it and would otherwise be second authors of the
  # same fact. www.keypaste.com is the same Worker and the same assets, so asking it too would
  # assert one thing twice.
  SITE_URL: https://keypaste.com

jobs:
  deploy:
    name: deploy + verify the live page
    # A fork pushing to its own main inherits no secret, so wrangler would fail on authentication
    # and read as this repository's workflow being broken. Named, rather than left to the shape of
    # the error a missing credential produces.
    if: github.repository == 'notinferred/keypaste'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The deploy credential is an ENVIRONMENT secret, not a repository one, and this environment's
    # deployment-branch rule names main alone. A workflow on any other ref cannot read it even if it
    # asks - which is the protection a repository secret does not give.
    environment: keypaste.com
    steps:
      # No fetch-depth: 0, unlike ci.yml's gate. Nothing here reads git history: both gates read
      # release-targets.json at this ref and the origin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Before anything is uploaded. The same gate that runs against the origin below, pointed at
      # the file about to become the origin - so a page that does not disclose what the advertised
      # download gets wrong never goes live in the first place, and the run after the deploy is only
      # ever about propagation.
      - name: Verify the page about to be deployed discloses what the download gets wrong
        shell: bash
        env:
          KEYPASTE_SITE_BODY: site/public/index.html
        run: scripts/verify-site-disclosure.sh

      # wrangler 4.114.0 declares engines.node >=22. No npm cache on purpose: this job holds the one
      # credential that can rewrite keypaste.com, and a restored Actions cache is a writable input a
      # branch can populate. `npm ci` over a locked tree costs less than that question is worth.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      # --ignore-scripts is deliberately absent: esbuild and workerd select their platform binary in
      # a postinstall, and a wrangler installed without them does not run.
      - name: Install wrangler from the lock file
        working-directory: site
        shell: bash
        run: npm ci

      - name: Deploy
        id: deploy
        working-directory: site
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler appends one NDJSON line per action here. Read instead of grepping
          # "Current Version ID:" out of the console: that string is prose a minor release may
          # reword, and the version id is the only thing a deliberate rollback can name.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          # Spelled out rather than inherited. `shell: bash` already supplies -eo pipefail, but this
          # step is the one that can leave a wrong page live, and a reader should not have to know a
          # runner default to see that a failed deploy stops here. Note also that wrangler's output
          # is NOT piped anywhere: WRANGLER_OUTPUT_FILE_PATH means there is no pipeline whose exit
          # status could mask its own.
          set -euo pipefail

          # The pinned binary by path, never bare `npx`, which fetches from the registry when
          # resolution misses - in a job holding a production deploy credential.
          ./node_modules/.bin/wrangler deploy

          version="$(jq -r 'select(.type == "deploy") | .version_id' \
                       "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"

          # D-0106's rule: a refusal rests on what came back. A missing or reworded entry stops here,
          # where the cause has a name, rather than arriving as an empty string and being recorded as
          # a deploy nobody can identify.
          case "$version" in
            ????????-????-????-????-????????????) ;;
            *) echo "::error::wrangler wrote no deploy version id; nothing can name what is now live"; exit 1 ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::keypaste.com is now serving version $version (${version:0:8})"
          {
            echo "### keypaste.com deployed"
            echo
            echo "Version ID \`$version\`, short \`${version:0:8}\` — the form DECISIONS and STEPS record."
          } >> "$GITHUB_STEP_SUMMARY"

      # The gates below emit ::error:: for anything they cannot find, and those become annotations on
      # this run and on the commit. Asking while the deploy is still propagating would leave a
      # permanent record of a failure that was never true, so the waiting happens here, on a question
      # neither gate asks: is the body the origin serves the file this commit deployed?
      #
      # Byte comparison rather than ETag, because keypaste.com serves no ETag - checked on GET, on a
      # cache-busted GET and on HEAD. Byte-for-byte is valid because Workers Assets serves
      # public/index.html unaltered: the Worker is reached for /subscribe alone
      # (wrangler.jsonc assets.run_worker_first), .gitattributes checks the file out LF everywhere,
      # and curl sends no Accept-Encoding.
      #
      # It cannot fail this run, and that is the point. A zone setting that started transforming the
      # HTML would make this loop never match, and a deploy check that goes red because a comparison
      # stopped being valid is worse than one that waits two minutes. This owns the waiting; the
      # steps below own the verdict.
      - name: Wait for the deployed page to reach this runner's edge
        shell: bash
        timeout-minutes: 5
        run: |
          set -uo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS -L --max-time 30 -o "$RUNNER_TEMP/live.html" "$SITE_URL/" \
               && cmp -s "$RUNNER_TEMP/live.html" site/public/index.html; then
              echo "the deployed page is being served, after attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo "::notice::$SITE_URL has not matched site/public/index.html after 20 attempts; asking the gates anyway, since they own the verdict"

      # The verdict, asked once. The only check in this repository that asks the origin rather than
      # the working tree, and what it looks for is the list of ways the advertised download can
      # destroy somebody's vault.
      - name: Verify keypaste.com discloses what the advertised download gets wrong
        shell: bash
        run: scripts/verify-site-disclosure.sh "$SITE_URL/"

      # The half of H-0011 that writes nothing. The checks that store a real address stay by hand in
      # site/README.md, and must not migrate here.
      - name: Verify the signup endpoint refuses what it should
        shell: bash
        run: scripts/verify-site-endpoint.sh "$SITE_URL"

      # A red verdict after a green deploy does not mean the deploy failed. It means the page live
      # right now does not carry the disclosure, and nothing has been taken back. No automatic
      # rollback: the previous version is usually the staler page, and which of two pages is worse is
      # not something this workflow can know.
      - name: Say what a red verdict means while the page is live
        if: failure() && steps.deploy.outcome == 'success'
        shell: bash
        env:
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          {
            echo "### The deploy succeeded and the live page is not compliant"
            echo
            echo "Version \`$VERSION\` is serving keypaste.com now. **Nothing was rolled back.**"
            echo
            echo "Repair it and push — that is the usual fix, because the pre-deploy check passed,"
            echo "so this is about what the origin is serving rather than about the page in the repo."
            echo "To go back deliberately: \`npx wrangler versions deploy <previous-version-id>\`"
            echo "from \`site/\`, after checking the previous page discloses more, not less."
          } >> "$GITHUB_STEP_SUMMARY"
