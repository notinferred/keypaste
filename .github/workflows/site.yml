name: site

# keypaste.com's checks, apart from ci.yml so the product builds, tests and releases without site/ (A.1).
# No release gate reads this workflow; it leaves with site/ for the site's own repository (A.2).
on:
  push:
    branches: ['**']
    paths:
      - 'site/**'
      - 'tests/vectors/**'
      - 'release-targets.json'
      - 'scripts/verify-site-disclosure.sh'
      - '.github/workflows/site.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Find site/
        id: site
        shell: bash
        run: |
          if [ -f site/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::no site/ here; nothing to check"; fi

      # The share and crash routes against stand-ins for their databases, offline.
      - name: Run the site's node tests
        if: steps.site.outputs.present == 'true'
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          npm ci --prefix site --omit=dev --ignore-scripts --no-audit --no-fund
          npm test --prefix site

      # The product owns the vectors in tests/vectors; the site's tests read their copies.
      - name: The site's vectors are the product's
        if: steps.site.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmp tests/vectors/share-vector.json site/test/share-vector.json
          cmp tests/vectors/crash-vector.json site/test/crash-vector.json

      - name: The download page discloses what the advertised release gets wrong
        if: steps.site.outputs.present == 'true'
        shell: bash
        env:
          KEYPASTE_SITE_BODY: site/public/download/index.html
        run: bash scripts/verify-site-disclosure.sh site/public/download/index.html
