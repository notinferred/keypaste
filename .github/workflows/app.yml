name: app

# Separate solutions keep desktop dependencies out of backend restores.

on:
  push:
    branches: [main]
    paths:
      - 'src/Keypaste.App/**'
      - 'src/Keypaste.Mvvm/**'
      - 'tests/Keypaste.App.Tests/**'
      - 'tests/Keypaste.App.Windows.Tests/**'
      - 'tests/Keypaste.MinimizeObserver/**'
      - 'tests/Keypaste.Consistency.Tests/**'
      - 'tests/Keypaste.AppDriver/**'
      - 'tests/Keypaste.FakeMcpClient/**'
      - 'tests/Keypaste.EnvReporter/**'
      - 'scripts/verify-keepassxc-workflows.sh'
      - 'scripts/verify-keepassxc-first-run.sh'
      - 'scripts/verify-session-authority.sh'
      - 'scripts/verify-lock-boundary.sh'
      - 'scripts/verify-current-state.sh'
      - 'scripts/verify-session-lifecycle.sh'
      - 'scripts/verify-desktop-approval.sh'
      - 'scripts/verify-agent-activity.sh'
      - 'scripts/verify-connect-client.sh'
      - 'scripts/verify-run-session.sh'
      - 'scripts/verify-held-saves.sh'
      - 'scripts/verify-crash-report.sh'
      - 'scripts/verify-browser-host.sh'
      - 'tests/Keypaste.FakeBrowser/**'
      - 'scripts/verify-clipboard-markers.sh'
      - 'scripts/exercise-desktop-install.sh'
      - 'scripts/exercise-desktop-upgrade.sh'
      - 'scripts/lib/**'
      - 'src/Keypaste.Mcp/**'
      - 'scripts/install-keepassxc.sh'
      - 'scripts/apt-install.sh'
      - 'src/Keypaste.Cli/**'
      - 'tests/Keypaste.Cli.Tests/**'
      - 'src/Keypaste.Core/**'
      - 'src/Keypaste.Browser/**'
      - 'third_party/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'
      - 'tests/Directory.Build.props'
      - 'tests/Keypaste.Core.Tests/PublisherMetadata.cs'
      - 'tests/Keypaste.Core.Tests/HardwareKeys/SoftwareYubiKey.cs'
      - 'tests/Keypaste.Core.Tests/ManualClock.cs'
      - 'tests/Keypaste.Core.Tests/FakeShareServer.cs'
      - 'tests/Keypaste.Core.Tests/FakeCrashServer.cs'
      - 'tests/Keypaste.Core.Tests/CheapKeyDerivation.cs'
      - 'tests/Keypaste.Core.Tests/ProjectVariables.cs'
      - 'tests/Keypaste.Core.Tests/ScriptedBridgeChannels.cs'
      - 'tests/Keypaste.Core.Tests/ForeignEdit.cs'
      - 'tests/Keypaste.Core.Tests/TestZones.cs'
      - 'scripts/verify.sh'
      - 'keypaste.app.slnx'
      - 'release-targets.json'
      - 'packaging/**'
      - 'scripts/verify-windows-installer.sh'
      - 'scripts/fetch-pinned-asset.sh'
      - 'scripts/build-argon2.sh'
      - 'scripts/build-libsodium.sh'
      - 'scripts/build-linux-appimage.sh'
      - 'scripts/build-macos-app.sh'
      - 'scripts/build-macos-dmg.sh'
      - 'scripts/verify-macos-cli-link.sh'
      - 'scripts/verify-linux-appimage.sh'
      - 'scripts/verify-publisher-metadata.sh'
      - 'scripts/publish-desktop-bridge.sh'
      - 'scripts/sign-windows.sh'
      - 'scripts/verify-windows-signature.sh'
      - 'scripts/rehearse-windows-signing.sh'
      - '.github/workflows/app.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
  workflow_dispatch:
    inputs:
      signing_rehearsal:
        description: Sign the Windows payload and installer with a runner-trusted certificate and upload nothing (3.6b)
        type: boolean
        default: false
  workflow_call:
    inputs:
      linux_only:
        description: Run only the Linux jobs, without the KeePassXC ones; only dev.yml's linux mode passes it (D-0460)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && format('-{0}-{1}', github.sha, github.event_name) || '' }}
  # A branch's newer run supersedes its last; main and tags keep every verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip
  # Reused MSBuild nodes retain artifact handles and can block later Windows builds.
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  # Every run runs every job; a dispatch or a tag's own run counts toward a release (D-0403, D-0423). dev.yml's linux
  # mode calls it with linux_only to run its Linux jobs but the KeePassXC ones; that run counts toward nothing (D-0460).
  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve the desktop targets this workflow packages
        id: targets
        shell: bash
        env:
          LINUX_ONLY: ${{ inputs.linux_only == true }}
          # A called workflow sees its caller's name, so only dev.yml's call may package a subset (D-0460).
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          n="$(jq -r '.components.app.targets | length' release-targets.json)"
          case "$n" in
            ''|*[!0-9]*) echo "::error::release-targets.json did not answer with a target count"; exit 1 ;;
          esac
          [ "$n" -ge 1 ] || { echo "::error::release-targets.json packages no app targets"; exit 1; }
          targets="$(jq -c --argjson linux_only "$LINUX_ONLY" '[.components.app.targets[] | select(($linux_only | not) or (.rid | startswith("linux-"))) | {os: .runner, rid, archive, msi: ([.packages[]? | select(.kind == "msi")] | length > 0), appimage: ([.packages[]? | select(.kind == "appimage")] | length > 0), dmg: ([.packages[]? | select(.kind == "dmg")] | length > 0)}]' release-targets.json)"
          kept="$(jq length <<< "$targets")"
          if [ "$LINUX_ONLY" = true ] && [ "$WORKFLOW" = dev ]; then
            [ "$kept" -ge 1 ] || { echo "::error::release-targets.json packages no Linux app target"; exit 1; }
          else
            [ "$kept" = "$n" ] || { echo "::error::only $kept of $n app targets reached the package matrix"; exit 1; }
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$kept of $n targets: $targets"

  # ci.yml's format job checks this solution's format too, since ci.yml runs on every source change.
  desktop:
    name: desktop tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.linux_only && '["ubuntu-24.04"]' || '["ubuntu-24.04","windows-2025","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore, build and test desktop and consistency
        shell: bash
        run: bash scripts/verify.sh desktop

  # The app, the CLI and an agent as real processes: approvals, locks, saves and the session's lifecycle.
  # macOS runs them under its stock bash 3.2 (D-0398).
  desktop-gates:
    name: desktop gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.linux_only && '["ubuntu-24.04"]' || '["ubuntu-24.04","windows-2025","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install GNU timeout (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: command -v gtimeout >/dev/null || brew install coreutils

      - name: Restore, build and drive the desktop gates
        shell: bash
        run: bash scripts/verify.sh desktop-gates

  # The supported workflows on vaults KeePassXC made, through the CLI and the app's screens (9.4, D-0307).
  compat:
    name: keepassxc workflows (${{ matrix.os }})
    if: ${{ !inputs.linux_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      # KeePassXC's Windows console encoding can alter a non-ASCII master password.
      KP_COMPAT_PASSWORD: ci-master-pw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install keepassxc-cli (Linux)
        if: runner.os == 'Linux'
        run: |
          bash scripts/apt-install.sh --no-install-recommends keepassxc

      - name: Install keepassxc-cli (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "KPXC_CLI=$(bash scripts/install-keepassxc.sh)" >> "$GITHUB_ENV"

      # So these builds derive keys with the library the packages carry (D-0523).
      - name: Build the libargon2 the app and the CLI carry
        shell: bash
        run: bash scripts/build-argon2.sh

      # The relay the gate starts loads the shared libsodium beside the CLI, as the fake browser does (8.1d).
      - name: Build the libsodium the relay loads
        shell: bash
        run: bash scripts/build-libsodium.sh

      - name: Restore and build the CLI, the app driver and the fake browser
        shell: bash
        run: |
          set -euo pipefail
          for project in src/Keypaste.Cli/Keypaste.Cli.csproj tests/Keypaste.AppDriver/Keypaste.AppDriver.csproj tests/Keypaste.FakeBrowser/Keypaste.FakeBrowser.csproj; do
            dotnet restore "$project" --locked-mode
            dotnet build "$project" --no-restore -c Release
          done

      - name: Verify every workflow on KeePassXC-made vaults through the CLI and the app
        shell: bash
        run: bash scripts/verify-keepassxc-workflows.sh artifacts/compat/workflows

  # The first run offers the databases real KeePassXC last opened, found where KeePassXC keeps them (N.2).
  first-run:
    name: keepassxc first run (${{ matrix.os }})
    if: ${{ !inputs.linux_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    env:
      KP_COMPAT_PASSWORD: ci-master-pw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install KeePassXC (Linux)
        if: runner.os == 'Linux'
        run: |
          bash scripts/apt-install.sh --no-install-recommends keepassxc

      - name: Install KeePassXC (Windows and macOS)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "KPXC_CLI=$(bash scripts/install-keepassxc.sh)" >> "$GITHUB_ENV"

      - name: Build the libargon2 the app carries
        shell: bash
        run: bash scripts/build-argon2.sh

      - name: Restore and build the app driver
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tests/Keypaste.AppDriver/Keypaste.AppDriver.csproj --locked-mode
          dotnet build tests/Keypaste.AppDriver/Keypaste.AppDriver.csproj --no-restore -c Release

      - name: Verify the first run offers the databases KeePassXC last opened
        shell: bash
        run: bash scripts/verify-keepassxc-first-run.sh artifacts/compat/first-run

  # What the platform clipboard offers after the app copies a secret, after its clear and after a
  # plain copy: the nspasteboard.org types on macOS, Klipper's hint on X11 (N.12). The readings go to
  # the log, since nothing in this workflow uploads before the installer is signed.
  clipboard-markers:
    name: clipboard markers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.linux_only && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore (locked) and build the observer
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore keypaste.app.slnx --locked-mode
          dotnet build tests/Keypaste.MinimizeObserver -c Release --no-restore -warnaserror

      - name: Start Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apt-install.sh xvfb xclip libx11-6 libice6 libsm6 libfontconfig1
          Xvfb :99 -screen 0 1280x800x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Read the clipboard's markers
        shell: bash
        run: bash scripts/verify-clipboard-markers.sh "$PWD/artifacts/bin/Keypaste.MinimizeObserver/release/Keypaste.MinimizeObserver" clipboard-markers

  package:
    name: publish + selftest (${{ matrix.os }})
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 13
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore keypaste.app.slnx --locked-mode

      - name: Resolve the prerelease suffix this build must carry
        id: suffix
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            case "$tag" in *-*) suffix="${tag#*-}" ;; esac
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "prerelease suffix: ${suffix:-<none>}"

      # Keypaste.Core's project puts it in the payload beside the app and its keypaste (D-0523).
      - name: Build the libargon2 the payload carries
        shell: bash
        run: bash scripts/build-argon2.sh '${{ matrix.rid }}'

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          # The Windows package is the app's Windows target, which reaches Windows Hello (D-0549).
          framework=net10.0
          if [ '${{ matrix.rid }}' = win-x64 ]; then framework=net10.0-windows10.0.19041.0; fi
          # Only these packages name where crash reports go; a source build sends none (D-0598).
          args=(-c Release -r '${{ matrix.rid }}' -f "$framework" --self-contained
            --no-restore -o 'artifacts/app/${{ matrix.rid }}' -p:KeypasteCrashEndpoint=https://keypaste.com)
          if [ -n "${{ steps.suffix.outputs.suffix }}" ]; then
            args+=('-p:VersionSuffix=${{ steps.suffix.outputs.suffix }}')
          fi
          dotnet publish src/Keypaste.App/Keypaste.App.csproj "${args[@]}"

      - name: Install the native toolchain for the bridge (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/apt-install.sh --no-install-recommends clang zlib1g-dev

      # A client connected from the app starts this copy, so the package carries it (2.6a).
      - name: Add the NativeAOT bridge to the payload
        shell: bash
        run: |
          set -euo pipefail
          suffix='${{ steps.suffix.outputs.suffix }}'
          # No empty array: macOS bash 3.2 refuses one under set -u.
          scripts/publish-desktop-bridge.sh '${{ matrix.rid }}' 'artifacts/app/${{ matrix.rid }}' ${suffix:+"-p:VersionSuffix=$suffix"}

      - name: Verify the native assets for this RID are there
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/app/${{ matrix.rid }}"
          found=$(find "$out" -iname '*SkiaSharp*' -o -iname '*HarfBuzzSharp*' | wc -l)
          echo "native asset files: $found"
          [ "$found" -ge 2 ] || { echo "::error::Skia/HarfBuzz natives missing from $out"; exit 1; }

      # The headless selftest cannot exercise native libraries that load on first render. It does derive a vault's key,
      # and names the libargon2 it derived with: the payload's on Windows and macOS, the system's on Linux (D-0523).
      - name: Start the published binary and run its selftest
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/app/${{ matrix.rid }}"
          bin="$out/keypaste-app"
          [ "${{ matrix.rid }}" = "win-x64" ] && bin="$out/keypaste-app.exe"
          [ -x "$bin" ] || { echo "::error::no binary at $bin"; exit 1; }
          "$bin" --selftest | tr -d '\r' > "$RUNNER_TEMP/selftest.out"
          cat "$RUNNER_TEMP/selftest.out"
          library="$(sed -n 's/^keypaste-app: Argon2 derived natively by //p' "$RUNNER_TEMP/selftest.out")"
          carried="$(bash scripts/build-argon2.sh --name '${{ matrix.rid }}')"
          if [ -n "$carried" ]; then
            case "$library" in
              *"$carried") ;;
              *) echo "::error::the payload derived Argon2 with ${library:-managed code}, not the $carried it carries"; exit 1 ;;
            esac
          else
            [ -n "$library" ] || { echo "::error::the payload derived Argon2 in managed code: no system libargon2 loaded"; exit 1; }
          fi

      # The NativeAOT keypaste beside it must derive as the app does, which its doctor names (D-0525).
      - name: Require the bridge's doctor to name the libargon2 it derives with
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/app/${{ matrix.rid }}"
          bin="$out/keypaste"
          [ "${{ matrix.rid }}" = "win-x64" ] && bin="$out/keypaste.exe"
          code=0
          "$bin" doctor --json > "$RUNNER_TEMP/doctor.json" || code=$?
          [ "$code" -eq 0 ] || [ "$code" -eq 7 ] || { echo "::error::keypaste doctor exited $code"; exit 1; }
          argon2="$(jq -c '.[] | select(.area == "argon2")' "$RUNNER_TEMP/doctor.json" | tr -d '\r')"
          echo "$argon2"
          [ "$(jq -r .status <<<"$argon2")" = ok ] \
            || { echo "::error::the payload's keypaste derived Argon2 in managed code: $(jq -r .says <<<"$argon2")"; exit 1; }
          carried="$(bash scripts/build-argon2.sh --name '${{ matrix.rid }}')"
          where="$(jq -r '.where // ""' <<<"$argon2")"
          if [ -n "$carried" ]; then
            case "$where" in
              *"$carried") ;;
              *) echo "::error::the payload's keypaste derived Argon2 with ${where:-a system library}, not the $carried it carries"; exit 1 ;;
            esac
          fi

      - name: Check the version the binary reports
        id: v
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/app/${{ matrix.rid }}"
          bin="$out/keypaste-app"
          [ "${{ matrix.rid }}" = "win-x64" ] && bin="$out/keypaste-app.exe"
          reported="$("$bin" --version | tr -d '[:space:]')"
          echo "binary reports $reported"
          echo "reported=$reported" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            want="${GITHUB_REF_NAME#v}"
            [ "$reported" = "$want" ] \
              || { echo "::error::tag $GITHUB_REF_NAME says $want but the binary reports $reported"; exit 1; }
            version="$want"
          else
            version="$reported-dryrun"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned signing dlib
        if: matrix.rid == 'win-x64'
        shell: bash
        run: scripts/sign-windows.sh --restore-dlib

      - name: Resolve the signing policy
        id: signing
        if: matrix.rid == 'win-x64'
        shell: bash
        run: echo "policy=$(jq -r '.components.app.signing.policy' release-targets.json | tr -d '\r')" | tee -a "$GITHUB_OUTPUT"

      - name: Sign in to Azure for Artifact Signing
        if: matrix.rid == 'win-x64' && !inputs.signing_rehearsal && steps.signing.outputs.policy == 'authenticode'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.KEYPASTE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.KEYPASTE_SIGNING_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Create the runner-trusted rehearsal identity
        id: rehearsal
        if: matrix.rid == 'win-x64' && inputs.signing_rehearsal
        shell: bash
        run: scripts/rehearse-windows-signing.sh identity | tee -a "$GITHUB_OUTPUT"

      - name: Sign the payload as the definition's policy says
        if: matrix.rid == 'win-x64'
        shell: bash
        env:
          REHEARSAL: ${{ steps.rehearsal.outputs.trusted }}
          KEYPASTE_SIGNING_ENDPOINT: ${{ vars.KEYPASTE_SIGNING_ENDPOINT }}
          KEYPASTE_SIGNING_ACCOUNT: ${{ vars.KEYPASTE_SIGNING_ACCOUNT }}
          KEYPASTE_SIGNING_PROFILE: ${{ vars.KEYPASTE_SIGNING_PROFILE }}
          KEYPASTE_SIGNING_CLIENT_ID: ${{ vars.KEYPASTE_SIGNING_CLIENT_ID }}
          KEYPASTE_SIGNING_TENANT_ID: ${{ vars.KEYPASTE_SIGNING_TENANT_ID }}
        run: |
          set -euo pipefail
          out="artifacts/app/${{ matrix.rid }}"
          if [ -n "$REHEARSAL" ]; then
            scripts/sign-windows.sh --component app --rehearsal "$REHEARSAL" "$out"
            scripts/verify-windows-signature.sh "$REHEARSAL" "$out/keypaste-app.exe" "$out/keypaste-app.dll" "$out/Keypaste.Core.dll" "$out/Keypaste.Mvvm.dll" "$out/KeePassLib.dll" "$out/keypaste.exe" "$out/argon2.dll"
            "$out/keypaste-app.exe" --selftest
          else
            scripts/sign-windows.sh --component app "$out"
          fi

      - name: Package and hash
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          out="artifacts/dist"; mkdir -p "$out"
          stage="artifacts/stage"; rm -rf "$stage"; mkdir -p "$stage"
          src="artifacts/app/${{ matrix.rid }}"
          cp -R "$src"/. "$stage"/
          rm -rf "$stage"/*.pdb "$stage"/*.dSYM
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage"/
          name="keypaste-app-${VERSION}-${{ matrix.rid }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$stage" && /c/Windows/System32/tar.exe -a -c -f "../dist/$name.zip" ./*)
          else
            # Exclude macOS AppleDouble metadata from release archives.
            COPYFILE_DISABLE=1 tar -czf "$out/$name.tar.gz" -C "$stage" .
          fi
          arch="$name.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            hash="$(cd "$out" && sha256sum "$arch" | cut -d' ' -f1)"
          else
            hash="$(cd "$out" && shasum -a 256 "$arch" | cut -d' ' -f1)"
          fi
          [ "${#hash}" -eq 64 ] || { echo "::error::bad checksum '$hash' for $arch"; exit 1; }
          # Both checksum tools accept two spaces, while their default output formats differ.
          printf '%s  %s\n' "$hash" "$arch" > "$out/$arch.sha256"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$out" && sha256sum -c "$arch.sha256")
          else
            (cd "$out" && shasum -a 256 -c "$arch.sha256")
          fi
          ls -l "$out"

      - name: Verify the packaged binaries publish as the project
        shell: bash
        run: scripts/verify-publisher-metadata.sh artifacts/stage

      - name: Build and check the internal installer the definition declares
        if: matrix.msi
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPORTED: ${{ steps.v.outputs.reported }}
          REHEARSAL: ${{ steps.rehearsal.outputs.trusted }}
          UNTRUSTED: ${{ steps.rehearsal.outputs.untrusted }}
          KEYPASTE_SIGNING_ENDPOINT: ${{ vars.KEYPASTE_SIGNING_ENDPOINT }}
          KEYPASTE_SIGNING_ACCOUNT: ${{ vars.KEYPASTE_SIGNING_ACCOUNT }}
          KEYPASTE_SIGNING_PROFILE: ${{ vars.KEYPASTE_SIGNING_PROFILE }}
          KEYPASTE_SIGNING_CLIENT_ID: ${{ vars.KEYPASTE_SIGNING_CLIENT_ID }}
          KEYPASTE_SIGNING_TENANT_ID: ${{ vars.KEYPASTE_SIGNING_TENANT_ID }}
        run: |
          set -euo pipefail
          msi="$(scripts/build-windows-installer.sh artifacts/stage "$VERSION" "$REPORTED" artifacts/dist)"
          name="$(basename "$msi")"
          if [ -n "$REHEARSAL" ]; then
            scripts/sign-windows.sh --component app --rehearsal "$REHEARSAL" "artifacts/dist/$name"
            scripts/rehearse-windows-signing.sh refusals "$REHEARSAL" "$UNTRUSTED" artifacts/app/win-x64/keypaste-app.exe "artifacts/dist/$name"
          else
            scripts/sign-windows.sh --component app "artifacts/dist/$name"
          fi

          hash="$(sha256sum < "artifacts/dist/$name" | cut -d' ' -f1)"
          [ "${#hash}" -eq 64 ] || { echo "::error::bad checksum '$hash' for $name"; exit 1; }
          printf '%s  %s\n' "$hash" "$name" > "artifacts/dist/$name.sha256"
          (cd artifacts/dist && sha256sum -c "$name.sha256")

      - name: Build and check the internal AppImage the definition declares
        if: matrix.appimage
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPORTED: ${{ steps.v.outputs.reported }}
        run: |
          set -euo pipefail
          bash scripts/apt-install.sh --no-install-recommends squashfs-tools desktop-file-utils file
          image="$(scripts/build-linux-appimage.sh artifacts/stage "$VERSION" artifacts/dist)"
          scripts/verify-linux-appimage.sh "$image" "$VERSION" "$REPORTED" artifacts/stage

          name="$(basename "$image")"
          hash="$(sha256sum < "$image" | cut -d' ' -f1)"
          [ "${#hash}" -eq 64 ] || { echo "::error::bad checksum '$hash' for $name"; exit 1; }
          printf '%s  %s\n' "$hash" "$name" > "artifacts/dist/$name.sha256"
          (cd artifacts/dist && sha256sum -c "$name.sha256")

      # The zipped bundle is the DMG's input and no release package, so it stays out of artifacts/dist (D-0513).
      - name: Build and check the app bundle the DMG wraps
        id: bundle
        if: matrix.dmg
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPORTED: ${{ steps.v.outputs.reported }}
        run: |
          set -euo pipefail
          bundle="$(scripts/build-macos-app.sh artifacts/stage "$VERSION" "$REPORTED" artifacts/bundle)"
          echo "zip=$bundle" >> "$GITHUB_OUTPUT"

      # Every build's bundle, as install-desktop checks only a dispatched candidate's installed copy (G.5).
      - name: Check a new terminal runs the bundle's keypaste through its link
        if: matrix.dmg
        shell: bash
        env:
          BUNDLE: ${{ steps.bundle.outputs.zip }}
          REPORTED: ${{ steps.v.outputs.reported }}
        run: scripts/verify-macos-cli-link.sh "$BUNDLE" "$REPORTED"

      - name: Build and check the internal DMG the definition declares
        if: matrix.dmg
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPORTED: ${{ steps.v.outputs.reported }}
          BUNDLE: ${{ steps.bundle.outputs.zip }}
        run: |
          set -euo pipefail
          image="$(scripts/build-macos-dmg.sh "$BUNDLE" "$VERSION" "$REPORTED" artifacts/dist)"

          name="$(basename "$image")"
          hash="$(shasum -a 256 < "$image" | cut -d' ' -f1)"
          [ "${#hash}" -eq 64 ] || { echo "::error::bad checksum '$hash' for $name"; exit 1; }
          printf '%s  %s\n' "$hash" "$name" > "artifacts/dist/$name.sha256"
          (cd artifacts/dist && shasum -a 256 -c "$name.sha256")

      # Attested now so a desktop download published by 4.7c can be checked like the CLI's (3.8).
      - name: Attest the desktop archive
        if: github.ref_type == 'tag' && steps.rehearsal.outputs.trusted == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/dist/keypaste-app-*.${{ matrix.archive }}

      - name: Attest the internal installer
        if: github.ref_type == 'tag' && matrix.msi && steps.rehearsal.outputs.trusted == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/dist/keypaste-app-*.msi

      - name: Attest the internal AppImage
        if: github.ref_type == 'tag' && matrix.appimage && steps.rehearsal.outputs.trusted == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/dist/keypaste-app-*.AppImage

      - name: Attest the internal DMG
        if: github.ref_type == 'tag' && matrix.dmg && steps.rehearsal.outputs.trusted == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/dist/keypaste-app-*.dmg

      - name: Remove the rehearsal certificates
        if: always() && steps.rehearsal.outputs.trusted != ''
        shell: bash
        run: scripts/rehearse-windows-signing.sh cleanup '${{ steps.rehearsal.outputs.trusted }}' '${{ steps.rehearsal.outputs.untrusted }}'

      - if: steps.rehearsal.outputs.trusted == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error
          retention-days: 7

  # The one check a pull request needs green: a skipped job passes, a failed or cancelled one does not.
  ok:
    name: app ok
    if: always()
    needs: [targets, desktop, desktop-gates, compat, first-run, clipboard-markers, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fail when any job failed or was cancelled
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" > /dev/null; then
            echo "::error::a required job failed or was cancelled"
            exit 1
          fi
