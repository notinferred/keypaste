name: app

# Separate solutions keep desktop dependencies out of backend restores.

on:
  push:
    branches: [main]
    paths:
      - 'src/Keypaste.App/**'
      - 'tests/Keypaste.App.Tests/**'
      - 'tests/Keypaste.MinimizeObserver/**'
      - 'tests/Keypaste.Consistency.Tests/**'
      - 'src/Keypaste.Cli/**'
      - 'tests/Keypaste.Cli.Tests/**'
      - 'src/Keypaste.Core/**'
      - 'third_party/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'
      - 'tests/Directory.Build.props'
      - 'tests/Keypaste.Core.Tests/PublisherMetadata.cs'
      - 'scripts/verify.sh'
      - 'scripts/verify-local-checks.sh'
      - 'keypaste.app.slnx'
      - 'release-targets.json'
      - 'packaging/**'
      - 'scripts/verify-windows-installer.sh'
      - 'scripts/fetch-pinned-asset.sh'
      - 'scripts/build-linux-appimage.sh'
      - 'scripts/verify-linux-appimage.sh'
      - 'scripts/verify-publisher-metadata.sh'
      - '.github/workflows/app.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip
  # Reused MSBuild nodes retain artifact handles and can block later Windows builds.
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  gate:
    name: format + analyzers + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore, format, build and test desktop and consistency
        shell: bash
        run: bash scripts/verify.sh desktop

      # GitHub reports an empty package matrix as a successful skipped job.
      - name: Resolve the desktop targets this workflow packages
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          n="$(jq -r '.components.app.targets | length' release-targets.json)"
          case "$n" in
            ''|*[!0-9]*) echo "::error::release-targets.json did not answer with a target count"; exit 1 ;;
          esac
          [ "$n" -ge 1 ] || { echo "::error::release-targets.json packages no app targets"; exit 1; }
          targets="$(jq -c '[.components.app.targets[] | {os: .runner, rid, archive, msi: ([.packages[]? | select(.kind == "msi")] | length > 0), appimage: ([.packages[]? | select(.kind == "appimage")] | length > 0)}]' release-targets.json)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$n targets: $targets"

  package:
    name: publish + selftest (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore keypaste.app.slnx --locked-mode

      - name: Resolve the prerelease suffix this build must carry
        id: suffix
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            case "$tag" in *-*) suffix="${tag#*-}" ;; esac
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "prerelease suffix: ${suffix:-<none>}"

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          args=(-c Release -r '${{ matrix.rid }}' --self-contained
            --no-restore -o 'artifacts/app/${{ matrix.rid }}')
          if [ -n "${{ steps.suffix.outputs.suffix }}" ]; then
            args+=('-p:VersionSuffix=${{ steps.suffix.outputs.suffix }}')
          fi
          dotnet publish src/Keypaste.App/Keypaste.App.csproj "${args[@]}"

      - name: Verify the native assets for this RID are there
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/app/${{ matrix.rid }}"
          found=$(find "$out" -iname '*SkiaSharp*' -o -iname '*HarfBuzzSharp*' | wc -l)
          echo "native asset files: $found"
          [ "$found" -ge 2 ] || { echo "::error::Skia/HarfBuzz natives missing from $out"; exit 1; }

      # The headless selftest cannot exercise native libraries that load on first render.
      - name: Start the published binary and run its selftest
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/app/${{ matrix.rid }}"
          bin="$out/keypaste-app"
          [ "${{ matrix.rid }}" = "win-x64" ] && bin="$out/keypaste-app.exe"
          [ -x "$bin" ] || { echo "::error::no binary at $bin"; exit 1; }
          "$bin" --selftest

      - name: Check the version the binary reports
        id: v
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/app/${{ matrix.rid }}"
          bin="$out/keypaste-app"
          [ "${{ matrix.rid }}" = "win-x64" ] && bin="$out/keypaste-app.exe"
          reported="$("$bin" --version | tr -d '[:space:]')"
          echo "binary reports $reported"
          echo "reported=$reported" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            want="${GITHUB_REF_NAME#v}"
            [ "$reported" = "$want" ] \
              || { echo "::error::tag $GITHUB_REF_NAME says $want but the binary reports $reported"; exit 1; }
            version="$want"
          else
            version="$reported-dryrun"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package and hash
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          out="artifacts/dist"; mkdir -p "$out"
          stage="artifacts/stage"; rm -rf "$stage"; mkdir -p "$stage"
          src="artifacts/app/${{ matrix.rid }}"
          cp -R "$src"/. "$stage"/
          rm -rf "$stage"/*.pdb "$stage"/*.dSYM
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage"/
          name="keypaste-app-${VERSION}-${{ matrix.rid }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$stage" && /c/Windows/System32/tar.exe -a -c -f "../dist/$name.zip" ./*)
          else
            # Exclude macOS AppleDouble metadata from release archives.
            COPYFILE_DISABLE=1 tar -czf "$out/$name.tar.gz" -C "$stage" .
          fi
          arch="$name.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            hash="$(cd "$out" && sha256sum "$arch" | cut -d' ' -f1)"
          else
            hash="$(cd "$out" && shasum -a 256 "$arch" | cut -d' ' -f1)"
          fi
          [ "${#hash}" -eq 64 ] || { echo "::error::bad checksum '$hash' for $arch"; exit 1; }
          # Both checksum tools accept two spaces, while their default output formats differ.
          printf '%s  %s\n' "$hash" "$arch" > "$out/$arch.sha256"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$out" && sha256sum -c "$arch.sha256")
          else
            (cd "$out" && shasum -a 256 -c "$arch.sha256")
          fi
          ls -l "$out"

      - name: Verify the packaged binaries publish as the project
        shell: bash
        run: scripts/verify-publisher-metadata.sh artifacts/stage

      - name: Build and check the internal installer the definition declares
        if: matrix.msi
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPORTED: ${{ steps.v.outputs.reported }}
          # The SDK resolves outside packages.lock.json, so its package is held to this digest (D-0139).
          WIX_SDK_SHA512: V6RzTWKEi35XdXySYygQ6YSuai9eaF3dPN+ADLN6+dORyqOdJ2uGOA0R/velRLtbiRHdOp+cYwHtKt2zM0396w==
        run: |
          set -euo pipefail
          package='.components.app.targets[] | select(.rid == "${{ matrix.rid }}") | .packages[] | select(.kind == "msi")'
          read_package() { jq -r "$package | .$1" release-targets.json | tr -d '\r'; }
          project="$(read_package project)"
          tool_version="$(read_package tool_version)"
          name="$(read_package pattern | sed -e "s/{version}/$VERSION/g" -e "s/{rid}/${{ matrix.rid }}/g")"

          dotnet restore "$project" --locked-mode
          packages="$(dotnet nuget locals global-packages --list | sed -E 's/^global-packages: //' | tr -d '\r')"
          nupkg="$packages/wixtoolset.sdk/$tool_version/wixtoolset.sdk.$tool_version.nupkg"
          observed="$(openssl dgst -sha512 -binary "$nupkg" | base64 -w0)"
          echo "WixToolset.Sdk $tool_version sha512: $observed"
          [ "$observed" = "$WIX_SDK_SHA512" ] || { echo "::error::WixToolset.Sdk $tool_version is not the pinned package"; exit 1; }

          dotnet build "$project" -c Release --no-restore -o artifacts/installer \
            -p:PayloadDir="$(cygpath -w "$PWD/artifacts/stage")\\" \
            -p:FullVersion="$VERSION" -p:ProductVersion="${VERSION%%-*}"
          mv artifacts/installer/keypaste-app.msi "artifacts/dist/$name"
          scripts/verify-windows-installer.sh "artifacts/dist/$name" "$VERSION" "$REPORTED" artifacts/stage

          hash="$(sha256sum < "artifacts/dist/$name" | cut -d' ' -f1)"
          [ "${#hash}" -eq 64 ] || { echo "::error::bad checksum '$hash' for $name"; exit 1; }
          printf '%s  %s\n' "$hash" "$name" > "artifacts/dist/$name.sha256"
          (cd artifacts/dist && sha256sum -c "$name.sha256")

      - name: Build and check the internal AppImage the definition declares
        if: matrix.appimage
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPORTED: ${{ steps.v.outputs.reported }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends squashfs-tools desktop-file-utils file
          image="$(scripts/build-linux-appimage.sh artifacts/stage "$VERSION" artifacts/dist)"
          scripts/verify-linux-appimage.sh "$image" "$VERSION" "$REPORTED" artifacts/stage

          name="$(basename "$image")"
          hash="$(sha256sum < "$image" | cut -d' ' -f1)"
          [ "${#hash}" -eq 64 ] || { echo "::error::bad checksum '$hash' for $name"; exit 1; }
          printf '%s  %s\n' "$hash" "$name" > "artifacts/dist/$name.sha256"
          (cd artifacts/dist && sha256sum -c "$name.sha256")

      # Attested now so a desktop download published by 4.7c can be checked like the CLI's (3.8).
      - name: Attest the desktop archive
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/dist/keypaste-app-*.${{ matrix.archive }}

      - name: Attest the internal installer
        if: github.ref_type == 'tag' && matrix.msi
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/dist/keypaste-app-*.msi

      - name: Attest the internal AppImage
        if: github.ref_type == 'tag' && matrix.appimage
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/dist/keypaste-app-*.AppImage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error
          retention-days: 7
