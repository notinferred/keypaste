# The tmux the demo is recorded in. Loaded with -f on a dedicated socket, so the author's own
# ~/.tmux.conf cannot change a single frame of a committed recording.

set  -g default-terminal "tmux-256color"
set  -g status off
set  -g escape-time 0
set  -g mouse off
set  -g history-limit 10000

# The panes are labelled, because a viewer has about two seconds to work out that the top one is a
# person's terminal and the bottom one is the agent's.
set  -g pane-border-status top
set  -g pane-border-format " #{pane_title} "

# Identical active and inactive borders on purpose: a border that changes colour when focus moves
# puts a flash in the GIF at the exact moment the viewer should be reading the approval question.
set  -g pane-border-style        "fg=colour240"
set  -g pane-active-border-style "fg=colour240"

setw -g automatic-rename off
setw -g allow-rename off
