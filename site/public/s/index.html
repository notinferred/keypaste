<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<title>keypaste — a shared secret</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/s/viewer.css">
<script type="module" src="/s/viewer.js"></script>
</head>
<body>
<main>
  <a class="lockup" href="/" aria-label="keypaste home">
    <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><rect class="mark-stem" x="10" y="8" width="10" height="48"/><polygon class="mark-arm" points="40,24 54,24 38,40 54,56 40,56 24,40"/></svg>
    <span>keypaste</span>
  </a>

  <section class="card" aria-labelledby="heading">
    <h1 id="heading">Someone shared a secret with you</h1>
    <p class="notice" id="notice" role="status" aria-live="polite">Opening the link…</p>

    <form id="prompt" hidden>
      <p class="meta" id="meta"></p>
      <div class="field" id="passphrase-row" hidden>
        <label for="passphrase">Passphrase</label>
        <input id="passphrase" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
        <p class="hint">The person who sent this link will have sent the passphrase separately.</p>
      </div>
      <p class="spend">Revealing it uses one view.</p>
      <button type="submit" class="button primary reveal" id="reveal">Reveal</button>
      <p class="error" id="error" role="alert" hidden></p>
    </form>

    <div id="result" hidden>
      <p class="title" id="title"></p>
      <div id="fields"></div>
      <p class="meta" id="after"></p>
    </div>
  </section>

  <p class="foot">Encrypted end to end: this page decrypts it with the key in the link, which never reaches the server. <a href="/">keypaste.com</a></p>
</main>
</body>
</html>
